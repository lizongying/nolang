name: Deploy Docs to GitHub Pages

on:
  push:
    tags:
      - "v*"
    paths:
      - 'docs/**'
      - 'src/**'
      - 'Makefile'
      - '.github/workflows/static.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'src/**'
      - 'Makefile'
      - '.github/workflows/static.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Golang
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          cache: true
          cache-dependency-path: src/go.sum

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # ── WASM alignment invariant ──────────────────────────────────────
      # no.wasm / lsp.wasm are rebuilt HERE, from THIS clean checkout, and the
      # site is built in the SAME job. The playground page in the published
      # artifact therefore loads a compiler + Direct-WASM codegen that are byte-
      # for-byte consistent with the docs it ships. Never vendor a stale
      # docs/static/wasm/*.wasm: a mismatch between the embedded compiler and the
      # Direct-WASM backend only surfaces as a runtime validation failure in the
      # browser, long after the deploy job has gone green. (The Direct-WASM
      # drift regression itself is caught earlier by `make playground-demos` in
      # the pr-verify job.)
      - name: Build no.wasm
        run: make no-wasm

      - name: Build lsp.wasm
        run: make lsp-wasm

      - name: Verify wasm artifacts
        run: |
          ls -la docs/static/wasm/
          test -s docs/static/wasm/no.wasm
          test -s docs/static/wasm/lsp.wasm

      - name: Verify WASI import surface
        # The browser instantiates these modules through @wasmer/wasi, which has
        # a fixed preview1 surface. Any extra import (canonically sock_accept /
        # sock_shutdown, linked in as soon as net/net/http joins the wasip1
        # build) makes WebAssembly.Instance throw LinkError and takes the whole
        # playground down — language service included. `make playground-demos`
        # cannot catch this because it drives the NATIVE no binary, so this gate
        # reads the artifacts' import sections with the engine itself.
        run: bun scripts/wasm_imports_check.ts docs/static/wasm/no.wasm docs/static/wasm/lsp.wasm

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: docs

      - name: Playground TypeScript typecheck
        # Same gate pr-verify runs: fail the deploy fast on a type error in the
        # rewritten runner / worker / lsp-bridge / lsp-worker / wasm-loader.
        run: bun run typecheck
        working-directory: docs

      - name: Verify playground demos
        # docs/src/playground/examples.ts is the ONLY hand-written teaching
        # surface the published site ships. This compiles every snippet through
        # the exact browser path (`no build --wasm-direct -target wasm32-wasi`)
        # and then EXECUTES the emitted module through the playground's own WASI
        # loader (`wasi-glue` + `wasm-loader`), asserting each `expect` string.
        #
        # Why here and not only in test.yml: this job already has bun, the docs
        # dependencies and a native `no` toolchain, and its path filter covers
        # every file that can break a demo (docs/**, src/**, Makefile). The gate
        # needs no wasmtime — the in-process WASI shim is the browser's own
        # loader, which is strictly better than a native runtime.
        #
        # Regression it would have caught: `?=` and value-matches were silently
        # miscompiled by the Direct-WASM backend (`s ?= s + 1` reported 0, field
        # value-matches emitted unvalidatable modules) while the native backend
        # was correct, so nothing else in CI noticed.
        run: make playground-demos

      - name: Smoke-test the wasm runtime
        # An import-surface check only proves the functions EXIST. @wasmer/wasi
        # also ships bodies that trap: poll_oneoff is `unimplemented!()`, so the
        # first time.Sleep / netpoll in any Go program executes `unreachable` and
        # the whole instance dies, with the import table looking perfectly clean.
        # This runs both artifacts through the same loader the workers use.
        run: |
          bun scripts/wasm_runtime_smoke.ts \
            --no-wasm docs/static/wasm/no.wasm \
            --lsp-wasm docs/static/wasm/lsp.wasm \
            --lsp

      - name: Build website
        run: bun run build
        working-directory: docs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build

  deploy:
    needs: build
    # Deploy only for release tags (refs/tags/v*); pull_request only builds to validate.
    # workflow_dispatch is kept as a manual redeploy escape hatch.
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
