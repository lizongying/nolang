name: build-llvm-windows

# ── 手動預編譯：Windows 版 LLVM 22.1.8（含 llvm-config.exe + 靜態庫）──────────
# 觸發方式：Actions 頁 →「Run workflow」→ 手動 dispatch。
#
# 為什麼需要這個 workflow：
#   build.yml 的 build-llvm-variants 要產出「靜態內嵌 libLLVM」的 no-llvm_windows_*
#   變體，Makefile 靠 `llvm-config` 取得 --cflags / --link-static 庫清單與 --libdir。
#   但官方 pre-built 的 Windows 包（llvm/llvm-project release 的 LLVM-<ver>-win64.exe
#   NSIS 安裝檔）「只是 clang/llvm 工具鏈」——不含 llvm-config.exe，也不含可鏈接的
#   LLVM 靜態庫（其 lib/cmake/llvm 僅有 LLVMConfigExtensions.cmake，無 LLVMConfig.cmake）。
#   見 llvm discourse #57692 與 llvm-project#53052。因此 build.yml 之前輪詢等
#   C:\Program Files\LLVM\bin\llvm-config.exe 永遠等不到 → 5 分鐘超時失敗。
#
#   解法：自己從源碼編一份 Windows LLVM，產出 llvm-config + 各元件靜態 .lib，
#   打包成 zip 發佈到一個固定的 GitHub Release（tag 見下方 RELEASE_TAG）。
#   build.yml 直接下載這個預編譯包解壓使用，不必每次發布都重編 LLVM。
#
# 成本與取捨：
#   全後端源碼編譯很慢（windows-latest 上約 1~3 小時），故只在手動 dispatch 跑；
#   產物可被 release 反覆下載。用 LLVM_DISTRIBUTION_COMPONENTS 只構建
#   「llvm-config + 頭文件 + llvm-libs（靜態庫）」，跳過 clang / opt / llc 等 CLI
#   工具，縮短構建時間並省磁碟（no-llvm 只需在進程內用 LLVM C API，靠 zig cc 連結）。
#
# 產物內容（安裝前後綴 C:/llvm 的可遷移佈局）：
#   bin/llvm-config.exe   —— 自帶，從自身位置推導 prefix，故解壓到任意路徑都能用
#   include/              —— llvm / llvm-c 頭文件（cgo 的 -I 目標）
#   lib/*.lib             —— 各元件靜態庫 + lib/cmake/llvm（cgo 的 -L/-l 目標）
#   上面三者 zip 成 LLVM-<ver>-win-x64-llvm-dev.zip 上傳到 RELEASE_TAG。
#
# ⚠️ ABI 匹配仍是實驗性：這裡用 MSVC（cl）編譯，靜態庫為 MSVC ABI；build.yml 端
#   cgo 預設用 zig cc（windows-gnu）。兩者在符號修飾 / C++ 運行時上不一致，實際
#   鏈接可能需就地迭代（見 build.yml build-llvm-variants 的 Windows 分支，仍標
#   continue-on-error）。本 workflow 只負責「把 llvm-config + 靜態庫弄出來」這一步。

on:
  workflow_dispatch:
    inputs:
      llvm_version:
        description: "LLVM 版本（源碼 tag：llvmorg-<ver>，需與 zig 內嵌版本對齊，預設 22.1.8）"
        required: true
        default: "22.1.8"

permissions:
  contents: write

env:
  # 固定發佈 tag：build.yml 用 `gh release download <此 tag>` 取包。改版就改這裡。
  RELEASE_TAG: "llvm-22.1.8-win-x64"
  # 安裝前後綴（無空格，避免 NSIS/-D 那類拆字問題；也直接對應 build.yml 解壓後引用路徑）
  INSTALL_PREFIX: "C:/llvm"

jobs:
  build-llvm-windows:
    runs-on: windows-latest

    steps:
      - name: Setup MSVC developer environment (cl / link on PATH)
        # ilammy/msvc-dev-cmd 把 Visual Studio 的 Developer Command Prompt 環境
        # 注入後續所有步驟，於是 cmake 能直接找到 cl.exe / link.exe / Windows SDK。
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.event.inputs.llvm_version }}"
          if ([string]::IsNullOrWhiteSpace($v)) { $v = "22.1.8" }
          echo "llvm_version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Download LLVM source
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.llvm_version }}"
          $url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-$v/llvm-project-$v.src.tar.xz"
          curl.exe -L -f -o llvm-src.tar.xz $url
          # Windows 內建 tar（bsdtar）支援 .tar.xz 解壓
          tar -xf llvm-src.tar.xz
          # 解壓後目錄名為 llvm-project-<ver>.src
          Rename-Item -Path "llvm-project-$v.src" -NewName "llvm-src"
          # 僅供確認源碼版本的資訊性輸出：用 -SimpleMatch 做字面比對，否則
          # Select-String 會把「set(LLVM_VERSION_MAJOR」的「(」當成正則分組，
          # 因「Not enough )'s」直接報錯退出（本步驟之前正是因此 exit 1）。
          Get-Content llvm-src/llvm/CMakeLists.txt | Select-String -SimpleMatch -Pattern "set(LLVM_VERSION_MAJOR" | Select-Object -First 1

      - name: Configure LLVM (Release, all needed backends, static libs only)
        shell: pwsh
        run: |
          # LLVM_TARGETS_TO_BUILD 對齊 no-llvm 的 FULLLLVM=1（x86 + AArch64 + ARM + WebAssembly）。
          # BUILD_SHARED_LIBS=OFF → 產出各元件靜態 .lib（llvm-config --link-static 要的正是這些）。
          # LLVM_DISTRIBUTION_COMPONENTS：只 build+install「llvm-config / 頭 / 靜態庫」，
          #   跳過 clang、opt、llc 等 CLI 工具，省时省碟。
          #   ⚠️ 元件名必須用 LLVM 內定的安裝 component 名：靜態庫是「llvm-libraries」
          #   （不是 llvm-libs，否則 LLVMDistributionSupport.cmake 報「doesn't have an
          #   install target」使 configure 直接失敗）；頭文件是「llvm-headers」。
          # 關掉 zlib/zstd/libxml2/terminfo 等可選依賴，避免 Windows 上找不到的鏈接問題。
          cmake -G Ninja -S llvm-src/llvm -B llvm-build -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX="${{ env.INSTALL_PREFIX }}" `
            -DLLVM_ENABLE_ASSERTIONS=OFF `
            -DBUILD_SHARED_LIBS=OFF `
            -DLLVM_TARGETS_TO_BUILD="X86;AArch64;ARM;WebAssembly" `
            -DLLVM_ENABLE_TERMINFO=OFF `
            -DLLVM_ENABLE_ZLIB=OFF `
            -DLLVM_ENABLE_ZSTD=OFF `
            -DLLVM_ENABLE_LIBXML2=OFF `
            -DLLVM_INCLUDE_TESTS=OFF `
            -DLLVM_INCLUDE_BENCHMARKS=OFF `
            -DLLVM_INCLUDE_EXAMPLES=OFF `
            -DLLVM_INCLUDE_DOCS=OFF `
            -DLLVM_BUILD_UTILS=ON `
            -DLLVM_DISTRIBUTION_COMPONENTS="llvm-config;llvm-headers;llvm-libraries" `
            -DLLVM_PARALLEL_LINK_JOBS=2

      - name: Build + install the distribution subset
        shell: pwsh
        run: |
          # `distribution` target：只編譯並安裝 LLVM_DISTRIBUTION_COMPONENTS 列出的元件
          #   （build + install 一步到位，直接落到 CMAKE_INSTALL_PREFIX）。
          #   佈局同 cmake --install（可遷移，llvm-config 從自身位置推 prefix），
          #   故這裡不再重複跑 `cmake --install`——它會試圖安裝未構建的全量元件而報錯。
          cmake --build llvm-build --target distribution

      - name: Verify llvm-config + libs landed
        shell: pwsh
        run: |
          $prefix = "${{ env.INSTALL_PREFIX }}"
          & "$prefix/bin/llvm-config.exe" --version
          & "$prefix/bin/llvm-config.exe" --includedir
          & "$prefix/bin/llvm-config.exe" --libdir
          # 至少要能看到幾個元件靜態庫，否則後續 cgo 一定鏈不起來
          $libdir = & "$prefix/bin/llvm-config.exe" --libdir
          $libcount = (Get-ChildItem -Path $libdir -Filter *.lib -Recurse | Measure-Object).Count
          if ($libcount -lt 1) { Write-Error "no static .lib under $libdir"; exit 1 }
          Write-Host "static libs found: $libcount"

      - name: Package the installed tree into a zip
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.llvm_version }}"
          $zip = "LLVM-$v-win-x64-llvm-dev.zip"
          # 把整個安裝前後綴（bin/include/lib）打包；解壓端保留相對結構即可直接用。
          Compress-Archive -Path "${{ env.INSTALL_PREFIX }}/*" -DestinationPath $zip -CompressionLevel Optimal
          echo "ZIP_NAME=$zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          du -h $zip 2>$null
          (Get-Item $zip).Length

      - name: Upload to GitHub Release (idempotent)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ env.RELEASE_TAG }}"
          # tag 不存在才建；已存在就覆寫同名 asset（重跑/改版時不必手动清）。
          if (-not (gh release view $tag 2>$null)) {
            gh release create $tag --title "Pre-built Windows LLVM (${{ steps.ver.outputs.llvm_version }}) for no-llvm" --notes "Manually built via .github/workflows/build-llvm-windows.yml. Contains llvm-config.exe + static libs missing from the official win64 installer. Consumed by build.yml build-llvm-variants (Windows)."
          }
          gh release upload $tag "${{ env.ZIP_NAME }}" --clobber
