name: build-llvm-windows

# ── 手動預編譯：Windows LLVM 22.1.8 llvm-dev（含 llvm-config + 靜態庫）──────────
# 觸發方式：Actions 頁 →「Run workflow」→ 手動 dispatch。
#
# 🔴 為什麼在 Linux 上交叉編譯，不在 Windows runner 上編：
#   官方 pre-built Windows 包不含 llvm-config，也不含可鏈接的 LLVM 靜態庫（見
#   llvm discourse #57692、llvm-project#53052）。之前試過在 Windows runner 用 MSVC
#   從源碼編，靜態庫為 MSVC ABI，與 consumer 端的 zig cc（windows-gnu + libc++）ABI
#   不一致 → cgo 鏈接必失敗。現統一為 zig cc -target windows-gnu（MinGW + libc++）
#   在 Linux 交叉編譯，兩端同工具鏈、同 C++ 標準庫、同 ABI，靜態鏈對稱。zig 自带全部
#   mingw headers + libc + libc++ + lld，不需 Windows SDK / MSVC / xwin。
#
# 🔴 兩階段交叉（LLVM 交叉編譯的固有要求）：
#   LLVM 構建期要跑 host 工具 llvm-tblgen（生成 *.inc）。若只覆蓋 CMAKE_C_COMPILER
#   為 zig 的 windows 交叉編譯器，CMake 會以為是 native build、嘗試執行 Windows PE
#   的 tblgen → 在 Linux 上「Exec format error」崩潰。故：
#     Stage A（native，系統 gcc/clang）：只編 llvm-tblgen + llvm-config，產出可在
#       Linux 跑的 host 工具。
#     Stage B（cross，zig -target windows-gnu + CMAKE_SYSTEM_NAME=Windows）：用
#       -DLLVM_NATIVE_TOOL_DIR 指向 Stage A 的 bin，讓交叉構建復用 native tblgen，
#       專心產出 Windows COFF 靜態庫（llvm-libs）與頭文件。
#   打包時把 Stage A 的 native llvm-config（Linux ELF）放進包 bin/——build.yml 在
#   Linux 上執行它取 --cflags/--link-static；它按自身位置推前綴，對可遷移解壓路徑
#   正確，且同版本同佈局，輸出的 -I/-L/-l 與 Windows 庫一致。
#
# 矩陣：
#   linux-amd64 (ubuntu-latest)      → 交叉編 x86_64-windows-gnu  → win-x64 包
#   linux-arm64 (ubuntu-24.04-arm)   → 交叉編 aarch64-windows-gnu → win-arm64 包
#   產物發佈到同一 Release tag，各自用不同 asset name。build.yml 按矩陣下載匹配的。
#
# 產物佈局（解壓前後綴可遷移；llvm-config 為 Linux ELF，在 Linux consumer 跑）：
#   bin/llvm-config          ← Linux 宿主 ELF（Stage A 產出）
#   include/                 ← llvm / llvm-c 頭（含交叉專用的 llvm/Config/*.h）
#   lib/libLLVM*.a           ← Windows COFF 格式靜態庫（zig lld 讀取）

on:
  workflow_dispatch:
    inputs:
      llvm_version:
        description: "LLVM 版本（源碼 tag：llvmorg-<ver>，需與 zig 內嵌版本對齊，預設 22.1.8）"
        required: true
        default: "22.1.8"

permissions:
  contents: write

env:
  # 統一發佈 tag（含兩個 asset：x64 + arm64）
  RELEASE_TAG: "llvm-22.1.8-windows"
  ZIG_VER: "0.17.0"
  LLVM_VERSION: "22.1.8"

jobs:
  build-llvm-windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86_64-windows-gnu：在 linux/amd64 runner 上原生交叉，zig 自帶 mingw sysroot。
          - runner: ubuntu-latest
            zig_arch: x86_64
            target: x86_64-windows-gnu
            cmake_system_processor: AMD64
            arch_label: win-x64
          # aarch64-windows-gnu：需 linux/arm64 原生 runner（zig aarch64-linux）。
          - runner: ubuntu-24.04-arm
            zig_arch: aarch64
            target: aarch64-windows-gnu
            cmake_system_processor: ARM64
            arch_label: win-arm64

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Install Zig ${{ env.ZIG_VER }}
        run: |
          curl -L -o zig.tar.xz "https://ziglang.org/download/${{ env.ZIG_VER }}/zig-${{ matrix.zig_arch }}-linux-${{ env.ZIG_VER }}.tar.xz"
          mkdir -p "$HOME/zig"
          tar -xf zig.tar.xz -C "$HOME/zig" --strip-components=1
          echo "$HOME/zig" >> "$GITHUB_PATH"
          "$HOME/zig/zig" version

      - name: Create zig cc/c++/ar/ranlib wrappers for ${{ matrix.target }}
        run: |
          # zig 是 multi-call，CMake 需要單一可執行檔。Linux 上用 #!/bin/sh 腳本即可
          # （不像 Windows 需要 .cmd）。-target 寫死進腳本，讓 Stage B 全程以該 Windows
          # ABI 產出 COFF 物件與靜態庫。
          ZIG="$HOME/zig/zig"
          printf '#!/bin/sh\nexec "%s" cc -target %s "$@"\n' "$ZIG" "${{ matrix.target }}" > "$HOME/zig/zigcc"
          printf '#!/bin/sh\nexec "%s" c++ -target %s "$@"\n' "$ZIG" "${{ matrix.target }}" > "$HOME/zig/zigcxx"
          printf '#!/bin/sh\nexec "%s" ar "$@"\n' "$ZIG" > "$HOME/zig/zigar"
          printf '#!/bin/sh\nexec "%s" ranlib "$@"\n' "$ZIG" > "$HOME/zig/zigranlib"
          chmod +x "$HOME/zig/zigcc" "$HOME/zig/zigcxx" "$HOME/zig/zigar" "$HOME/zig/zigranlib"

      - name: Download LLVM ${{ env.LLVM_VERSION }} source
        run: |
          v="${{ env.LLVM_VERSION }}"
          curl -L -f -o llvm-src.tar.xz \
            "https://github.com/llvm/llvm-project/releases/download/llvmorg-$v/llvm-project-$v.src.tar.xz"
          tar -xf llvm-src.tar.xz
          mv "llvm-project-$v.src" llvm-src

      - name: Stage A - configure & build NATIVE llvm-tblgen + llvm-config
        run: |
          # 用系統 gcc/clang（Linux 原生 ELF），產出可在本 runner 執行的 host 工具。
          # 只編 tblgen（構建期生成 .inc 用）與 llvm-config（打包進 bin/，consumer 端跑）。
          # ⚠️ LLVM_TARGETS_TO_BUILD 必須與 Stage B 一致（四後端）：打包進去的 llvm-config
          #    的 --components/--targets-built 由這個宏決定，consumer 端 Makefile 據 --components
          #    推 LLVM_STATIC_COMPONENTS 再 --link-static 鏈庫；若這裡只有 X86，FULLLLVM=1
          #    要初始化的 AArch64/ARM/WebAssembly 後端會漏鏈 libLLVM*.a → undefined symbol。
          #    本階段只 --target llvm-tblgen llvm-config，不會真編後端庫，配置成四後端即可。
          sudo apt-get update && sudo apt-get install -y build-essential ninja-build cmake
          cmake -G Ninja -S llvm-src/llvm -B llvm-native \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_ENABLE_ASSERTIONS=OFF \
            -DLLVM_TARGETS_TO_BUILD="X86;AArch64;ARM;WebAssembly" \
            -DLLVM_INCLUDE_TESTS=OFF -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF -DLLVM_INCLUDE_DOCS=OFF \
            -DLLVM_ENABLE_ZLIB=OFF -DLLVM_ENABLE_ZSTD=OFF -DLLVM_ENABLE_LIBXML2=OFF \
            -DLLVM_BUILD_UTILS=OFF
          cmake --build llvm-native --target llvm-tblgen llvm-config
          test -x llvm-native/bin/llvm-tblgen || { echo "::error::native llvm-tblgen missing"; exit 1; }
          test -x llvm-native/bin/llvm-config || { echo "::error::native llvm-config missing"; exit 1; }

      - name: Stage B - configure CROSS build (zig windows-gnu, static libs)
        run: |
          # BUILD_SHARED_LIBS=OFF → 產出各元件靜態 .a（llvm-config --link-static 要這些）。
          # CMAKE_SYSTEM_NAME=Windows 讓 LLVM/CMake 進入交叉模式：不嘗試執行目標端工具，
          #   改用 LLVM_NATIVE_TOOL_DIR 裡的 Stage A native tblgen。
          # CMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY → configure 期的編譯器測試只編
          #   靜態庫、不去鏈接/運行 exe（避免 Windows PE 在 Linux 上跑不了）。
          # 元件名必須用「llvm-libraries」（不是 llvm-libs，否則 configure 報 install target 缺失）。
          # 關掉 zlib/zstd/libxml2/terminfo 等可選依賴，避免交叉鏈接找不到的問題。
          # LLVM_TARGETS_TO_BUILD：x86 + AArch64 + ARM + WebAssembly（對齊 consumer 的 FULLLLVM=1）。
          PREFIX="$GITHUB_WORKSPACE/llvm-dev-${{ matrix.arch_label }}"
          mkdir -p "$PREFIX"
          NATIVE_BIN="$GITHUB_WORKSPACE/llvm-native/bin"
          cmake -G Ninja -S llvm-src/llvm -B llvm-cross \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_SYSTEM_PROCESSOR=${{ matrix.cmake_system_processor }} \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DCMAKE_C_COMPILER="$HOME/zig/zigcc" \
            -DCMAKE_CXX_COMPILER="$HOME/zig/zigcxx" \
            -DCMAKE_ASM_COMPILER="$HOME/zig/zigcc" \
            -DCMAKE_AR="$HOME/zig/zigar" \
            -DCMAKE_RANLIB="$HOME/zig/zigranlib" \
            -DLLVM_NATIVE_TOOL_DIR="$NATIVE_BIN" \
            -DLLVM_HOST_TRIPLE=${{ matrix.target }} \
            -DLLVM_DEFAULT_TARGET_TRIPLE=${{ matrix.target }} \
            -DLLVM_ENABLE_ASSERTIONS=OFF \
            -DBUILD_SHARED_LIBS=OFF \
            -DLLVM_TARGETS_TO_BUILD="X86;AArch64;ARM;WebAssembly" \
            -DLLVM_ENABLE_TERMINFO=OFF \
            -DLLVM_ENABLE_ZLIB=OFF \
            -DLLVM_ENABLE_ZSTD=OFF \
            -DLLVM_ENABLE_LIBXML2=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_DOCS=OFF \
            -DLLVM_BUILD_UTILS=OFF \
            -DLLVM_DISTRIBUTION_COMPONENTS="llvm-headers;llvm-libraries"

      - name: Stage B - build + install Windows COFF static libraries
        run: |
          # 用 install-<component> 目標驅動構建：install-llvm-libraries 依賴全部靜態庫
          # target，故會先交叉編出（tblgen 用 LLVM_NATIVE_TOOL_DIR 的 native 版）再裝到
          # CMAKE_INSTALL_PREFIX。不能用 `--target llvm-libs`：那個 umbrella 在當前
          # LLVM/ninja 配置下不存在（ninja: unknown target 'llvm-libs'）；也別用
          # `distribution`（只 stage 到 <build>/llvm-dist 再打包，不落 prefix）。
          # 元件名用 'llvm-libraries'（不是 'llvm-libs'）。
          cmake --build llvm-cross --target install-llvm-headers install-llvm-libraries

      - name: Add native llvm-config + verify prefix
        run: |
          PREFIX="$GITHUB_WORKSPACE/llvm-dev-${{ matrix.arch_label }}"
          # 把 Stage A 的 native（Linux ELF）llvm-config 放進包 bin/，consumer 在 Linux 執行它。
          mkdir -p "$PREFIX/bin"
          cp "$GITHUB_WORKSPACE/llvm-native/bin/llvm-config" "$PREFIX/bin/llvm-config"
          # 落地驗證
          if [ ! -x "$PREFIX/bin/llvm-config" ]; then
            echo "::error::install did not produce $PREFIX/bin/llvm-config"
            find "$PREFIX" -maxdepth 3 -print | head -50
            exit 1
          fi
          "$PREFIX/bin/llvm-config" --version
          LIBDIR=$("$PREFIX/bin/llvm-config" --libdir)
          echo "libdir=$LIBDIR"
          COUNT=$(find "$LIBDIR" -name 'libLLVM*.a' | wc -l)
          echo "static libs: $COUNT"
          [ "$COUNT" -ge 1 ] || { echo "::error::no static libLLVM*.a found under $LIBDIR"; exit 1; }

      - name: Package llvm-dev archive
        run: |
          PREFIX="$GITHUB_WORKSPACE/llvm-dev-${{ matrix.arch_label }}"
          ASSET="LLVM-${{ env.LLVM_VERSION }}-${{ matrix.arch_label }}-llvm-dev.tgz"
          # -C "$PREFIX" . → 归档根就是 bin/include/lib（无外层目录），consumer 直接
          # tar -xzf 到目标前缀即得 <prefix>/bin/llvm-config。与旧 zip 的 Compress-Archive 'prefix/*' 对齐。
          tar -czf "$ASSET" -C "$PREFIX" .
          echo "ASSET=$ASSET" >> "$GITHUB_ENV"
          ls -lh "$ASSET"

      - name: Upload to GitHub Release (idempotent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ env.RELEASE_TAG }}"
          # 本 workflow 無 actions/checkout，CWD 不是 git 倉庫，gh 無法自動推目標倉庫
          # （報「failed to run git: fatal: not a git repository」）。必須顯式帶 --repo。
          REPO="${{ github.repository }}"
          # 兩個矩陣 job 都會跑到這一步。第一個創建 tag，第二個 view 成功就跳過 create。
          # race condition（同時 create）：第二個失敗於「已存在」，用 || true 吞掉。
          gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$REPO" \
                 --title "Pre-built Windows LLVM ${LLVM_VERSION} (zig/MinGW) for no-llvm" \
                 --notes "Built on Linux via zig cc/c++ targeting windows-gnu (MinGW + libc++). Two-stage cross build; contains a Linux-runnable llvm-config + Windows COFF static libs (libLLVM*.a). Consumed by build.yml build-llvm-variants (cross-windows entries)." \
            || true  # tag 已被另一個 job 創建，忽略
          gh release upload "$TAG" "${{ env.ASSET }}" --repo "$REPO" --clobber
