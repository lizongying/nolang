name: build-llvm-windows

# ── 手動預編譯：Windows 版 LLVM 22.1.8（含 llvm-config.exe + 靜態庫）──────────
# 觸發方式：Actions 頁 →「Run workflow」→ 手動 dispatch。
#
# 為什麼需要這個 workflow：
#   build.yml 的 build-llvm-variants 要產出「靜態內嵌 libLLVM」的 no-llvm_windows_*
#   變體，Makefile 靠 `llvm-config` 取得 --cflags / --link-static 庫清單與 --libdir。
#   但官方 pre-built 的 Windows 包（llvm/llvm-project release 的 LLVM-<ver>-win64.exe
#   NSIS 安裝檔）「只是 clang/llvm 工具鏈」——不含 llvm-config.exe，也不含可鏈接的
#   LLVM 靜態庫（其 lib/cmake/llvm 僅有 LLVMConfigExtensions.cmake，無 LLVMConfig.cmake）。
#   見 llvm discourse #57692 與 llvm-project#53052。因此 build.yml 之前輪詢等
#   C:\Program Files\LLVM\bin\llvm-config.exe 永遠等不到 → 5 分鐘超時失敗。
#
#   解法：自己從源碼編一份 Windows LLVM，產出 llvm-config + 各元件靜態庫，
#   打包成 zip 發佈到一個固定的 GitHub Release（tag 見下方 RELEASE_TAG）。
#   build.yml 直接下載這個預編譯包解壓使用，不必每次發布都重編 LLVM。
#
# 🔴 ABI 對齊（Option A：zig / MinGW）：
#   這裡「用 zig cc / zig c++ 編 LLVM」，目標 windows-gnu（MinGW + libc++），產出的
#   靜態庫是 libLLVM*.a（GNU 命名 / GNU ABI / libc++）。build.yml 端 cgo 也用
#   CC="zig cc"、LLVM_STATIC_EXTRA_LIBS="-lc++"——兩邊同工具鏈、同 C++ 標準庫、同 ABI，
#   llvm-config --link-static 吐的也是 mingw 風格 -l 旗標，正好能被 zig cc（lld）解析。
#   （舊版曾改用 MSVC cl.exe 編，靜態庫為 MSVC ABI + libcpmt，與 zig cc/libc++ 對不上，
#   靜態鏈接必失敗——現已切到 zig 統一。）
#   ⚠️ 全量 LLVM 用 zig 編在 Windows 上仍可能踩個別編譯／鏈接坑，故 build.yml 端保留
#      continue-on-error。本 workflow 失敗不影響 Linux/macOS 發布。
#
# 成本與取捨：
#   全後端源碼編譯很慢（windows-latest 上約 1~3 小時），故只在手動 dispatch 跑；
#   產物可被 release 反覆下載。用 LLVM_DISTRIBUTION_COMPONENTS 只構建
#   「llvm-config + 頭文件 + llvm-libraries（靜態庫）」，跳過 clang / opt / llc 等 CLI
#   工具，縮短構建時間並省磁碟（no-llvm 只需在進程內用 LLVM C API，靠 zig cc 連結）。
#
# 產物內容（安裝前後綴 C:/llvm 的可遷移佈局）：
#   bin/llvm-config.exe   —— 自帶，從自身位置推導 prefix，故解壓到任意路徑都能用
#   include/              —— llvm / llvm-c 頭文件（cgo 的 -I 目標）
#   lib/*.a               —— 各元件靜態庫（mingw 命名）+ lib/cmake/llvm（cgo 的 -L/-l 目標）
#   上面三者 zip 成 LLVM-<ver>-win-x64-llvm-dev.zip 上傳到 RELEASE_TAG。

on:
  workflow_dispatch:
    inputs:
      llvm_version:
        description: "LLVM 版本（源碼 tag：llvmorg-<ver>，需與 zig 內嵌版本對齊，預設 22.1.8）"
        required: true
        default: "22.1.8"

permissions:
  contents: write

env:
  # 固定發佈 tag：build.yml 用 `gh release download <此 tag>` 取包。改版就改這裡。
  RELEASE_TAG: "llvm-22.1.8-win-x64"
  # 安裝前後綴（無空格；也直接對應 build.yml 解壓後引用路徑）
  INSTALL_PREFIX: "C:/llvm"
  # zig 宿主架構 + 版本（對齊 LLVM 22.1.8：zig 0.17.0 內嵌 clang/lld/libc 同源）
  ZIG_VER: "0.17.0"

jobs:
  build-llvm-windows:
    runs-on: windows-latest

    steps:
      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.event.inputs.llvm_version }}"
          if ([string]::IsNullOrWhiteSpace($v)) { $v = "22.1.8" }
          echo "llvm_version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Install Zig (provides clang/lld/libc++ used as the C/C++ toolchain)
        shell: pwsh
        run: |
          # 不再用 ilammy/msvc-dev-cmd（MSVC）：改用 zig cc/zig c++ 作編譯器，
          # 讓靜態庫與 build.yml 端 cgo（zig cc + -lc++）同 ABI。見頂部 Option A 說明。
          $zv = "${{ env.ZIG_VER }}"
          curl.exe -L -f -o zig.zip "https://ziglang.org/download/$zv/zig-x86_64-windows-$zv.zip"
          Expand-Archive -Path zig.zip -DestinationPath C:\zigraw -Force
          $zigExe = (Get-ChildItem C:\zigraw -Recurse -Filter zig.exe | Select-Object -First 1).FullName
          $zigDir = Split-Path $zigExe
          # 讓後續步驟（含 cmake 內部呼叫）能找到 zig，並把 exe 絕對路徑留給包裝腳本。
          echo $zigDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8
          echo "ZIG_EXE=$zigExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $zigExe version

      - name: Create zig cc / zig c++ / zig ar / zig ranlib wrappers
        shell: pwsh
        run: |
          # CMake 需要「單一可執行檔」當編譯器／歸檔器，但 zig 是 multi-call：`zig cc`、
          # `zig c++`、`zig ar`、`zig ranlib` 都是子命令。故寫 .cmd 包裝腳本轉發參數。
          # 路徑無空格（C:\zig、D:\a\...），%* 直傳即可；clang 也支援 @rsp 回應檔。
          $z = $env:ZIG_EXE
          $wrap = "C:\zig"
          New-Item -ItemType Directory -Force -Path $wrap | Out-Null
          function Make-Cmd($name, $sub) {
            $body = "@echo off`r`n`"$z`" $sub %*`r`n"
            Set-Content -Path (Join-Path $wrap $name) -Value $body -Encoding ascii
          }
          Make-Cmd "zigcc.cmd"     "cc"
          Make-Cmd "zigcxx.cmd"    "c++"
          Make-Cmd "zig-ar.cmd"    "ar"
          Make-Cmd "zig-ranlib.cmd" "ranlib"
          Get-ChildItem $wrap -Filter *.cmd | ForEach-Object { Write-Host $_.FullName }

      - name: Download LLVM source
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.llvm_version }}"
          $url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-$v/llvm-project-$v.src.tar.xz"
          curl.exe -L -f -o llvm-src.tar.xz $url
          # Windows 內建 tar（bsdtar）支援 .tar.xz 解壓
          tar -xf llvm-src.tar.xz
          # 解壓後目錄名為 llvm-project-<ver>.src
          Rename-Item -Path "llvm-project-$v.src" -NewName "llvm-src"
          # 僅供確認源碼版本的資訊性輸出：用 -SimpleMatch 做字面比對，否則
          # Select-String 會把「set(LLVM_VERSION_MAJOR」的「(」當成正則分組，
          # 因「Not enough )'s」直接報錯退出（本步驟之前正是因此 exit 1）。
          Get-Content llvm-src/llvm/CMakeLists.txt | Select-String -SimpleMatch -Pattern "set(LLVM_VERSION_MAJOR" | Select-Object -First 1

      - name: Configure LLVM (Release, all needed backends, static libs only, zig toolchain)
        shell: pwsh
        run: |
          # CMAKE_*_COMPILER 全指向 zig 包裝腳本：C 用 zigcc，C++/歸檔用 zigcxx/zig-ar。
          # zig cc 在 windows 宿主預設目標 x86_64-w64-windows-gnu（MinGW），CMake 認成
          # Clang + GNU ABI，於是不會注入 MSVC 專用旗標，靜態庫命名走 lib*.a。
          # LLVM_TARGETS_TO_BUILD 對齊 no-llvm 的 FULLLLVM=1（x86 + AArch64 + ARM + WebAssembly）。
          # BUILD_SHARED_LIBS=OFF → 產出各元件靜態庫（llvm-config --link-static 要的正是這些）。
          # LLVM_DISTRIBUTION_COMPONENTS：只 build+install「llvm-config / 頭 / 靜態庫」，
          #   跳過 clang、opt、llc 等 CLI 工具，省时省碟。
          #   ⚠️ 元件名必須用 LLVM 內定的安裝 component 名：靜態庫是「llvm-libraries」
          #   （不是 llvm-libs，否則 LLVMDistributionSupport.cmake 報「doesn't have an
          #   install target」使 configure 直接失敗）；頭文件是「llvm-headers」。
          # 關掉 zlib/zstd/libxml2/terminfo 等可選依賴，避免 Windows 上找不到的鏈接問題。
          cmake -G Ninja -S llvm-src/llvm -B llvm-build -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INSTALL_PREFIX="${{ env.INSTALL_PREFIX }}" `
            -DCMAKE_C_COMPILER="C:/zig/zigcc.cmd" `
            -DCMAKE_CXX_COMPILER="C:/zig/zigcxx.cmd" `
            -DCMAKE_ASM_COMPILER="C:/zig/zigcc.cmd" `
            -DCMAKE_AR="C:/zig/zig-ar.cmd" `
            -DCMAKE_RANLIB="C:/zig/zig-ranlib.cmd" `
            -DLLVM_ENABLE_ASSERTIONS=OFF `
            -DBUILD_SHARED_LIBS=OFF `
            -DLLVM_TARGETS_TO_BUILD="X86;AArch64;ARM;WebAssembly" `
            -DLLVM_ENABLE_TERMINFO=OFF `
            -DLLVM_ENABLE_ZLIB=OFF `
            -DLLVM_ENABLE_ZSTD=OFF `
            -DLLVM_ENABLE_LIBXML2=OFF `
            -DLLVM_INCLUDE_TESTS=OFF `
            -DLLVM_INCLUDE_BENCHMARKS=OFF `
            -DLLVM_INCLUDE_EXAMPLES=OFF `
            -DLLVM_INCLUDE_DOCS=OFF `
            -DLLVM_BUILD_UTILS=ON `
            -DLLVM_DISTRIBUTION_COMPONENTS="llvm-config;llvm-headers;llvm-libraries" `
            -DLLVM_PARALLEL_LINK_JOBS=2

      - name: Build + install llvm-config / headers / static libs to the prefix
        shell: pwsh
        run: |
          # 1) 先用 zig 把「llvm-config 工具 + 全部靜態庫（llvm-libs meta-target）」編出來。
          cmake --build llvm-build --target llvm-config llvm-libs
          # 2) 再把三個需要的元件「安裝」到 CMAKE_INSTALL_PREFIX（C:/llvm）。
          #    ⚠️ 不能用 `--target distribution`：LLVM 的 distribution 是把元件 stage 到
          #    <build>/llvm-dist 再打包，不會落到 CMAKE_INSTALL_PREFIX——之前正是因此
          #    C:/llvm/bin/llvm-config.exe 一直不存在，Verify 步 `&` 報「not recognized as a
          #    ... executable program」。改用 llvm_distribution_add_targets 依
          #    LLVM_DISTRIBUTION_COMPONENTS 生成的 install-<component> 目標，直接裝到 prefix。
          cmake --build llvm-build --target install-llvm-config install-llvm-headers install-llvm-libraries
          # 落地檢查：裝完必須能在 prefix/bin 看到 llvm-config.exe，否則後續 Verify/Packaging 都無意義。
          $prefix = "${{ env.INSTALL_PREFIX }}"
          if (-not (Test-Path "$prefix/bin/llvm-config.exe")) {
            Write-Host "---- $prefix tree ----"
            Get-ChildItem -Recurse $prefix -ErrorAction SilentlyContinue | Select-Object -First 50 FullName
            Write-Host "----------------------"
            Write-Error "install did not produce $prefix/bin/llvm-config.exe (check install-<component> targets above)"
            exit 1
          }

      - name: Verify llvm-config + libs landed
        shell: pwsh
        run: |
          $prefix = "${{ env.INSTALL_PREFIX }}"
          & "$prefix/bin/llvm-config.exe" --version
          & "$prefix/bin/llvm-config.exe" --includedir
          & "$prefix/bin/llvm-config.exe" --libdir
          # 至少要能看到幾個元件靜態庫，否則後續 cgo 一定鏈不起來。
          # zig/MinGW 產的是 lib*.a（GNU 命名）；保留 *.lib 過濾以防後續改回 MSVC ABI。
          $libdir = & "$prefix/bin/llvm-config.exe" --libdir
          $libcount = (Get-ChildItem -Path $libdir -Include *.a,*.lib -Recurse | Measure-Object).Count
          if ($libcount -lt 1) { Write-Error "no static libs (.a/.lib) under $libdir"; exit 1 }
          Write-Host "static libs found: $libcount"

      - name: Package the installed tree into a zip
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.llvm_version }}"
          $zip = "LLVM-$v-win-x64-llvm-dev.zip"
          # 把整個安裝前後綴（bin/include/lib）打包；解壓端保留相對結構即可直接用。
          Compress-Archive -Path "${{ env.INSTALL_PREFIX }}/*" -DestinationPath $zip -CompressionLevel Optimal
          echo "ZIP_NAME=$zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host ("zip bytes: " + (Get-Item $zip).Length)

      - name: Upload to GitHub Release (idempotent)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ env.RELEASE_TAG }}"
          # 本 workflow 沒有 actions/checkout，工作目录不是 git 倉庫，gh 無法自動推
          # 目標倉庫（報「fatal: not a git repository」）。故每条 gh 都顯式帶 --repo。
          $repo = "${{ github.repository }}"
          # tag 不存在才建；已存在就覆寫同名 asset（重跑/改版時不必手动清）。
          if (-not (gh release view $tag --repo $repo 2>$null)) {
            gh release create $tag --repo $repo --title "Pre-built Windows LLVM (${{ steps.ver.outputs.llvm_version }}) for no-llvm" --notes "Manually built via .github/workflows/build-llvm-windows.yml with zig cc/zig c++ (windows-gnu, libc++ ABI). Contains llvm-config.exe + static libs missing from the official win64 installer. Consumed by build.yml build-llvm-variants (Windows)."
          }
          gh release upload $tag "${{ env.ZIP_NAME }}" --repo $repo --clobber
