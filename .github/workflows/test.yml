name: test

# Quality gate: the audit (NOLANG-AUDIT-2026-09-27.md §6.1) found that CI ran
# NO tests at all — only cross-compilation + a wasm smoke. That is why 13 files
# could sit broken and regressions shipped with a release unnoticed. This
# workflow closes that hole with cheap, high-signal gates.

on:
  push:
    tags:
      - "v*"
  pull_request:

jobs:
  # ── Go toolchain: must compile + vet cleanly ──────────────────────────
  go-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
      - name: Generate std artifacts (stdsig_gen.go, std_ast.bin)
        # `make` always runs this first; plain `cd src && go build ./...` would
        # otherwise fail to compile: //go:embed std_ast.bin is missing and the
        # generated signature tables (embeddedStdFuncSigs, etc.) are undefined.
        # Keep CI consistent with `make`.
        run: make gen
      - name: Build toolchain
        run: cd src && go build ./...
      - name: Vet toolchain
        run: cd src && go vet ./...
      - name: Check gofmt (src/lsp src/fmt src/fmtflow)
        # 2026-11-15: the LSP formatting pipeline is gofmt-clean; keep it that way.
        # 2026-11-16: src/fmt and src/fmtflow (the shared rewrite pipeline used by
        # both `no fmt` and LSP) are clean too — gate them together so the
        # single-source contract cannot drift back into divergent code.
        # Scope stays deliberately narrow: the whole src tree is not clean yet, and
        # files such as src/build/transpiler_entry.go sit INSIDE STDSIG_KEY_SRCS —
        # gofmt there would change the baked std signature key. Widen this gate
        # only in a dedicated cleanup commit that also regenerates the key.
        run: |
          out=$(gofmt -l src/lsp src/fmt src/fmtflow)
          if [ -n "$out" ]; then
            echo "gofmt violations:"
            echo "$out"
            exit 1
          fi

  # ── Corpus compile gate (§2 class of "compile directly fails") ──────────
  # Compile (do not run) every corpus file. Cheap, yet it catches the exact
  # regression family the audit flagged — programs that fail MIR/codegen outright.
  corpus-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"

      - name: Cache LLVM
        id: llvm-cache
        uses: actions/cache@v6
        with:
          path: |
            /usr/lib/llvm-21
            /usr/local/bin/opt
            /usr/local/bin/llc
          key: llvm-21-ubuntu-latest

      - name: Install LLVM (opt/llc)
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 21
          sudo apt-get install -y llvm-21 llvm-21-dev clang
          sudo ln -sf /usr/lib/llvm-21/bin/opt /usr/local/bin/opt
          sudo ln -sf /usr/lib/llvm-21/bin/llc /usr/local/bin/llc

      - name: Add LLVM to PATH
        run: |
          sudo ln -sf /usr/lib/llvm-21/bin/opt /usr/local/bin/opt
          sudo ln -sf /usr/lib/llvm-21/bin/llc /usr/local/bin/llc
          echo "/usr/lib/llvm-21/bin" >> $GITHUB_PATH
          /usr/lib/llvm-21/bin/opt --version

      - name: Build no binary
        run: make no

      - name: Compile corpus
        run: |
          # Every corpus file must compile (not run). If a file ever fails on a
          # KNOWN compiler/platform defect (not a corpus regression), add its
          # path to `skip` below with a comment naming the issue, and remove it
          # once the defect is fixed so the gate re-covers it.
          # (Empty as of now: os.sysctl's Linux /proc/sys lowering and the
          #  method-receiver typeHint fix let tests/std-unix-fs-os-2.no and
          #  tests/std-net-ext.no build on ubuntu again.)
          skip=""
          fail=0
          for f in tests/*.no tests/mem-safety/*.no; do
            [ -f "$f" ] || continue
            case " $skip " in
              *" $f "*) echo "SKIP (known defect): $f"; continue;;
            esac
            if ! ./bin/no build -o /tmp/out.bin "$f"; then
              echo "BUILD FAIL: $f"
              fail=1
            fi
          done
          exit $fail

  # ── nosql package regression tests ────────────────────────────────────
  nosql-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"

      - name: Cache LLVM
        id: llvm-cache
        uses: actions/cache@v6
        with:
          path: |
            /usr/lib/llvm-21
            /usr/local/bin/opt
            /usr/local/bin/llc
          key: llvm-21-ubuntu-latest

      - name: Install LLVM (opt/llc)
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 21
          sudo apt-get install -y llvm-21 llvm-21-dev clang
          sudo ln -sf /usr/lib/llvm-21/bin/opt /usr/local/bin/opt
          sudo ln -sf /usr/lib/llvm-21/bin/llc /usr/local/bin/llc

      - name: Add LLVM to PATH
        run: |
          sudo ln -sf /usr/lib/llvm-21/bin/opt /usr/local/bin/opt
          sudo ln -sf /usr/lib/llvm-21/bin/llc /usr/local/bin/llc
          echo "/usr/lib/llvm-21/bin" >> $GITHUB_PATH
          /usr/lib/llvm-21/bin/opt --version

      - name: Build no binary
        run: make no

      - name: Install canonical SQLite 3.54.0
        run: |
          mkdir -p "$RUNNER_TEMP/sqlite-3.54.0"
          curl -fsSL https://www.sqlite.org/2026/sqlite-tools-linux-x64-3540000.zip \
            -o "$RUNNER_TEMP/sqlite-3.54.0.zip"
          unzip -q "$RUNNER_TEMP/sqlite-3.54.0.zip" -d "$RUNNER_TEMP/sqlite-3.54.0"
          test "$("$RUNNER_TEMP/sqlite-3.54.0/sqlite3" --version)" \
            = "3.54.0 2026-04-09 12:25:13 8fa8248e303219400c646a885e36dfc52eae33d83f4412e3f369b2be5373aapl (64-bit)"

      - name: Run nosql package gates
        run: make test-nosql SQLITE="$RUNNER_TEMP/sqlite-3.54.0/sqlite3"

  # ── std library regression tests ──────────────────────────────────────
  std-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"

      - name: Cache LLVM
        uses: actions/cache@v6
        with:
          path: |
            /usr/lib/llvm-21
            /usr/local/bin/opt
            /usr/local/bin/llc
          key: llvm-21-ubuntu-latest

      - name: Install LLVM (opt/llc)
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 21 || true
          sudo apt-get install -y llvm-21 llvm-21-dev clang
          sudo ln -sf /usr/lib/llvm-21/bin/opt /usr/local/bin/opt
          sudo ln -sf /usr/lib/llvm-21/bin/llc /usr/local/bin/llc
          echo "/usr/lib/llvm-21/bin" >> $GITHUB_PATH

      - name: Build no binary
        run: make no

      - name: Run std tests
        run: |
          # Run the whole test-std/src directory in one `no test` invocation: it
          # walks every .no file sequentially (compile + run) and exits 1 if any
          # file fails. -timeout guards against a single hang blocking CI; each
          # file is capped at 120s and gets killed cleanly with its process
          # group. Never drop a file from the gate silently.
          ./bin/no test -timeout 120 test-std/src

  # ── Static check gate: std + tests must vet with 0 errors ──────────────
  vet-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"

      - name: Build no binary
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 21 || true
          sudo apt-get install -y llvm-21 llvm-21-dev clang
          sudo ln -sf /usr/lib/llvm-21/bin/opt /usr/local/bin/opt
          sudo ln -sf /usr/lib/llvm-21/bin/llc /usr/local/bin/llc
          echo "/usr/lib/llvm-21/bin" >> $GITHUB_PATH
          make no

      - name: vet src/std
        run: ./bin/no vet src/std
      - name: vet tests
        run: ./bin/no vet tests

  # ── noui（GPUI 风格 UI 框架）无头全量测试 ─────────────────────────────
  # noui 是 macOS 优先的 C/SDL3 shim，build-shims.sh 默认走 /opt/homebrew，
  # 所以用 macos runner；测试本身在无头 dummy 驱动下跑，不需要真实窗口。
  # 运行器脚本：noui/scripts/run-noui-tests.sh（帧闸 + 退出码判定 + 并行）。
  noui-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"

      - name: Install LLVM + SDL3 + TTF (brew)
        run: |
          brew install llvm sdl3 sdl3_ttf || brew install llvm sdl3 sdl3_ttf
          # 单测墙钟上限用 gtimeout；没有就退化为不封顶（测试自身会退出）
          brew install coreutils || true

      - name: Build no binary
        run: make no

      - name: Build noui shims + headless suite
        run: |
          cd noui
          ./build-shims.sh
          ./scripts/run-noui-tests.sh
