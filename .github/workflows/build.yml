name: build

on:
  push:
    tags:
      - "v*"
  pull_request:

jobs:
  build-release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Golang
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - name: Set Version Name
        id: set_version_name
        run: |
          VERSION_WITHOUT_V=$(echo '${{ github.ref_name }}' | sed 's/^v*//')
          echo "version_name=${VERSION_WITHOUT_V}" >> $GITHUB_ENV
          echo "build_date=$(date -u '+%s')" >> $GITHUB_ENV

      - name: Generate std artifacts
        # `make no` / `make gen` generates stdsig_gen.go + std_ast.bin before
        # building; the hand-rolled cross-compile below needs both or it fails on
        # the missing //go:embed std_ast.bin and the undefined signature tables.
        run: make gen

      - name: Compute std sig key
        id: sigkey
        run: echo "key=$(cd src && go run ./checker/genstdsig -key-only 2>/dev/null)" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          cd ./src
          mkdir -p ../bin

          go vet ./cmd/no

          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "-s -w -X 'main.version=${{ env.version_name }}' -X 'main.buildDate=${{ env.build_date }}' -X 'github.com/lizongying/nolang/checker.StdSigKey=${{ steps.sigkey.outputs.key }}'" -o ./../bin/no_linux_amd64 ./cmd/no

          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -ldflags "-s -w -X 'main.version=${{ env.version_name }}' -X 'main.buildDate=${{ env.build_date }}' -X 'github.com/lizongying/nolang/checker.StdSigKey=${{ steps.sigkey.outputs.key }}'" -o ./../bin/no_linux_arm64 ./cmd/no

          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "-s -w -X 'main.version=${{ env.version_name }}' -X 'main.buildDate=${{ env.build_date }}' -X 'github.com/lizongying/nolang/checker.StdSigKey=${{ steps.sigkey.outputs.key }}'" -o ./../bin/no_darwin_amd64 ./cmd/no

          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -ldflags "-s -w -X 'main.version=${{ env.version_name }}' -X 'main.buildDate=${{ env.build_date }}' -X 'github.com/lizongying/nolang/checker.StdSigKey=${{ steps.sigkey.outputs.key }}'" -o ./../bin/no_darwin_arm64 ./cmd/no

          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "-s -w -X 'main.version=${{ env.version_name }}' -X 'main.buildDate=${{ env.build_date }}' -X 'github.com/lizongying/nolang/checker.StdSigKey=${{ steps.sigkey.outputs.key }}'" -o ./../bin/no_windows_amd64.exe ./cmd/no

          # Ensure executable bit on non-Windows binaries (GitHub release
          # downloads may not preserve permissions; set +x before upload).
          chmod +x ./../bin/no_linux_amd64 ./../bin/no_linux_arm64 ./../bin/no_darwin_amd64 ./../bin/no_darwin_arm64

      - name: Get History
        id: get_history
        run: |
          chmod +x history.sh
          output=$(./history.sh)
          echo "$output" > history.md

      - name: Create Release (idempotent)
        id: create_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          # 重跑 / 強制重推 tag 時，若該 tag 的 release 已存在（例如前次失敗的
          # release 重建），不可再用 actions/create-release（會報 422 已存在）；
          # 此處改為「不存在才建立」，使 build-release 可安全重入。
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Release $TAG" --notes-file history.md
          fi

      - name: Upload Release Assets (idempotent, clobber)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          # --clobber：覆寫同 tag 前次 run 已上傳的 asset（避免「asset 同名已存在」報錯）。
          # 與下方 build-llvm-variants 的 `gh release upload ... --clobber` 模式一致。
          gh release upload "$TAG" --clobber \
            ./bin/no_linux_amd64 \
            ./bin/no_linux_arm64 \
            ./bin/no_darwin_amd64 \
            ./bin/no_darwin_arm64 \
            ./bin/no_windows_amd64.exe

  # ── 內置 LLVM 的發布變體（靜態 libLLVM）─────────────────────────────────
  # 與上面的純 Go 產物並存：產物自帶 LLVM，使用者不必安裝 LLVM；配合 `-cc zig`
  # （zig 自帶 clang + lld + libc）即可做到零外部工具鏈構建。
  # LLVM 版本對齊 zig 0.17.0 所用的 22.1.8（見 https://ziglang.org/download/0.17.0/release-notes.html
  # 「This release of Zig upgrades to LLVM 22.1.8」），讓 `zig cc` 與內嵌 LLVM 同源。
  #
  # 🔴 以 FULLLLVM=1 構建，讓內嵌 LLVM 註冊「全部後端」（x86 + aarch64 + arm + wasm）。
  # 這是必需的，不是可選的最佳化：預設（非 FULLLLVM）的內嵌變體按宿主裁剪，只註冊
  # 「宿主架構 + wasm」（見 Makefile 的 LLVM_STATIC_COMPONENTS / LLVM_TARGET_DEFINES），
  # 因此 x86_64 runner 上的產物無法為 aarch64 產生程式碼——llvmapi 對未註冊的後端
  # 會直接硬錯（LLVMGetTargetFromTriple 失敗，見 src/build/llvmapi/llvmapi_capi.go），
  # 而非回退到 clang。`.github/actions/build-nolang` 的職責正是「單一 Linux runner
  # 交叉編譯到全部目標」，它改用本變體後不再安裝 opt/llc，故這裡必須是全後端。
  # 下方 "Cross-compile smoke test" 步驟釘住這個能力（改回宿主裁剪會讓它失敗）。
  #
  # 注意：cgo 無法交叉編譯（darwin 目標需要 macOS SDK、windows 需要原生工具鏈），
  # 所以這裡是矩陣「原生 runner 原生構建」，而非一次交叉出全部平台。
  # darwin/amd64 內置 LLVM 變體已移除：GitHub 已退役 x64 macOS runner，而 LLVM 22
  # 起上游不再發行 x86_64-apple-darwin 預編譯包（22.1.8 的 macOS 資產只剩
  # LLVM-<ver>-macOS-ARM64.tar.xz）。cgo 又無法交叉編譯，Rosetta 下無從取得 x86_64
  # 的 LLVM 靜態庫，故不構建這個變體；darwin/amd64 使用者仍拿純 Go 版
  # no_darwin_amd64（build-release 以 CGO_ENABLED=0 交叉編譯）。
  # windows/* 改為「端到端 Linux 交叉編譯」（不再用 Windows runner）：
  #   windows-amd64 LLVM ← linux-amd64 (ubuntu-latest) 用 zig 交叉 x86_64-windows-gnu
  #   windows-arm64 LLVM ← linux-arm64 (ubuntu-24.04-arm) 用 zig 交叉 aarch64-windows-gnu
  # zig cc -target *-windows-gnu 自带全部 mingw headers + libc + libc++ + lld（COFF），
  # 不需 Windows SDK / MSVC / xwin；预编译包与本 workflow 的 cgo 同工具链、同 ABI
  # （MinGW + libc++），静态链接天然对齐（-lc++）。
  # LLVM 预编译包由 .github/workflows/build-llvm-windows.yml（手动 dispatch）在同样
  # 的 Linux runner 上用 zig 编好 llvm-config（Linux ELF）+ 头 + Windows COFF 静态库，
  # 发布到 Release tag llvm-22.1.8-windows。cross-windows 条目 can_run: false（Linux
  # 无法执行 .exe），故只构建产物、跳过执行类测试。不标 experimental——所有任务
  # （含 windows 交叉）必须全部成功才算发布成功，任一失败即阻断整个 workflow。
  # 代價：全後端產物比純 Go 版（~12 MB）大得多，故作為額外 asset 而非替換現有產物。
  build-llvm-variants:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: no-llvm_linux_amd64
            llvm_pkg: llvm-22-dev
            go_arch: x64
            zig_arch: x86_64
            llvm_host_target: x86
            ext: ""
          # ubuntu-24.04-arm 為 public repo 的原生 ARM runner（cgo 需要原生構建）
          - os: ubuntu-24.04-arm
            asset: no-llvm_linux_arm64
            llvm_pkg: llvm-22-dev
            go_arch: arm64
            zig_arch: aarch64
            llvm_host_target: aarch64
            ext: ""
          - os: macos-latest
            asset: no-llvm_darwin_arm64
            llvm_pkg: ""
            go_arch: arm64
            zig_arch: aarch64
            llvm_host_target: aarch64
            ext: ""
          # windows/* 端到端 Linux 交叉編譯（zig cc/c++ -target *-windows-gnu）。
          # LLVM 預編譯包由 build-llvm-windows.yml 在同一對 Linux runner 上用 zig 編好，
          # 兩邊同工具鏈 / 同 ABI (MinGW + libc++)，cgo 靜態鏈接天然對齊。
          # can_run: false 表示 Linux runner 無法執行 .exe，跳過 run 測試。
          - os: ubuntu-latest
            asset: no-llvm_windows_amd64
            go_arch: x64
            zig_arch: x86_64
            llvm_host_target: x86
            ext: ".exe"
            cross: "windows"
            goos: windows
            goarch: amd64
            zig_target: x86_64-windows-gnu
            llvm_asset: LLVM-22.1.8-win-x64-llvm-dev.tgz
            can_run: false
          - os: ubuntu-24.04-arm
            asset: no-llvm_windows_arm64
            go_arch: arm64
            zig_arch: aarch64
            llvm_host_target: aarch64
            ext: ".exe"
            cross: "windows"
            goos: windows
            goarch: arm64
            zig_target: aarch64-windows-gnu
            llvm_asset: LLVM-22.1.8-win-arm64-llvm-dev.tgz
            can_run: false
    # 所有 matrix 任务（含 cross-windows）都是硬闸：任一失败即整个 workflow 失败。
    # fail-fast: false 只表示「不因单个任务失败而取消其他任务」，失败的 job 仍会把
    # workflow 标红，保证能看到全部任务的结果。
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Golang
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          architecture: ${{ matrix.go_arch }}

      - name: "Install LLVM 22 (Linux - headers + static libs)"
        # 跳過 cross=windows 的條目：它們不需要宿主 Linux LLVM，而是用預編譯
        # 的 windows llvm-dev 包（下一步）。僅 linux_amd64 / linux_arm64 原生變體用 apt.llvm.org。
        if: runner.os == 'Linux' && matrix.cross != 'windows'
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 22
          sudo apt-get install -y ${{ matrix.llvm_pkg }} libzstd-dev libz3-dev libxml2-dev
          sudo ln -sf /usr/lib/llvm-22/bin/llvm-config /usr/local/bin/llvm-config-22
          llvm-config-22 --version

      - name: "Install LLVM 22 (macOS arm64 - brew)"
        if: runner.os == 'macOS'
        run: |
          brew install llvm@22 zstd z3 libxml2 || brew install llvm zstd z3 libxml2
          LLVM_PREFIX=$(brew --prefix llvm@22 2>/dev/null || brew --prefix llvm)
          echo "$LLVM_PREFIX/bin" >> $GITHUB_PATH
          # brew 的 llvm 是 keg-only，二進位就叫 llvm-config；我們統一用 llvm-config-22 指代
          sudo ln -sf "$LLVM_PREFIX/bin/llvm-config" /usr/local/bin/llvm-config-22
          llvm-config-22 --version

      - name: "Download pre-built LLVM 22 (cross-windows llvm-dev from our release)"
        if: matrix.cross == 'windows'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 不用官方 pre-built Windows 包（LLVM-<ver>-win64.exe NSIS）：它不含 llvm-config，
          # 也不含可鏈接的 LLVM 靜態庫（見 llvm discourse #57692、llvm-project#53052）。
          # 改用自己預編譯的包：由 .github/workflows/build-llvm-windows.yml（手動 dispatch）
          # 在 Linux 上用 zig cc/c++ -target *-windows-gnu（MinGW + libc++）從源碼編好
          # llvm-config（Linux ELF 宿主工具）+ 頭文件 + Windows COFF 靜態庫，發佈到同一
          # Release tag（llvm-22.1.8-windows）下、按架構分不同 asset。這裡按 matrix.llvm_asset 下載。
          # 因預編譯與本 workflow 的 cgo 都用 zig/libc++ 同 ABI，靜態鏈接才能對齊。
          # 若要升級 LLVM 版本：先跑 build-llvm-windows.yml 出新包，再同步這裡的
          # $Tag / matrix.llvm_asset 與 Build 步驟的 LLVM_CONFIG 路徑。
          Tag="llvm-22.1.8-windows"
          Asset="${{ matrix.llvm_asset }}"
          # 先確認本倉庫的 Release 與資產確實存在，不存在就給出清晰指引（而非讓
          # gh 抛「Release not found」這種看不出前因後果的錯）——這個包需要手動跑
          # build-llvm-windows.yml 預編譯才會生成，首次發版很容易漏。
          if ! gh release view "$Tag" >/dev/null 2>&1; then
            echo "::error::Windows LLVM 預編譯包不存在：本倉庫尚無 Release tag '$Tag'"
            echo "找不到 Release '$Tag'。請先在默認分支手動觸發 .github/workflows/build-llvm-windows.yml（Actions → Run workflow，llvm_version=22.1.8）生成並上傳 '$Asset'，再重跑本發布。"
            exit 1
          fi
          if ! gh release view "$Tag" --json assets --jq '.assets[].name' | grep -qxF "$Asset"; then
            echo "::error::Release '$Tag' 存在，但裡面沒有資產 '$Asset'"
            echo "Release '$Tag' 已存在但缺少預編譯資產 '$Asset'（可能上次預編譯未跑完或被刪）。請重跑 build-llvm-windows.yml 以 --clobber 重新上傳。"
            exit 1
          fi
          gh release download "$Tag" -p "$Asset"
          PREFIX="$GITHUB_WORKSPACE/llvm-dev"
          rm -rf "$PREFIX"; mkdir -p "$PREFIX"
          # tgz 根即 bin/include/lib（打包端 tar -czf -C prefix .），直接解到 $PREFIX。
          tar -xzf "$Asset" -C "$PREFIX"
          if [ ! -x "$PREFIX/bin/llvm-config" ]; then
            echo "::error::pre-built llvm-dev missing bin/llvm-config after unpack: $PREFIX"
            find "$PREFIX" -maxdepth 3 -print | head -50
            exit 1
          fi
          # 把前綴路徑傳給後續 Build 步（LLVM_CONFIG）。
          echo "LLVM_DEV=$PREFIX" >> "$GITHUB_ENV"
          "$PREFIX/bin/llvm-config" --version
          "$PREFIX/bin/llvm-config" --host-target

      - name: Install Zig 0.17.0 (bundles clang/lld/libc/libcxx matching LLVM 22.1.8)
        shell: bash
        run: |
          # 按宿主架構取 zig：Linux 用 zig_arch 選 x86_64/aarch64（ubuntu-24.04-arm 上不能
          # 鏈 x86_64 二進位，否则 `cannot execute binary file`）。現在所有變體都在
          # Linux/macOS runner 上跑（windows 改為 Linux 交叉），不再有 Windows 宿主分支。
          case "${{ runner.os }}" in
            Linux) ZIG_TARBALL=zig-${{ matrix.zig_arch }}-linux-0.17.0.tar.xz ;;
            macOS) ZIG_TARBALL=zig-${{ matrix.zig_arch }}-macos-0.17.0.tar.xz ;;
          esac
          curl -L -o zig.tar.xz "https://ziglang.org/download/0.17.0/$ZIG_TARBALL"
          mkdir -p "$HOME/zig"
          tar -xf zig.tar.xz -C "$HOME/zig" --strip-components=1
          echo "$HOME/zig" >> "$GITHUB_PATH"
          "$HOME/zig/zig" version

      - name: Build statically linked no (embedded LLVM, all backends)
        # FULLLLVM=1：註冊 x86 + aarch64 + arm + wasm 全部後端，使產物能為非宿主
        # 架構產生程式碼（交叉編譯的前提）。開啟後 LLVM_HOST_TARGET 不再影響
        # 要鏈接/註冊哪些後端，仍傳入以保持 matrix 設定完整。
        shell: bash
        run: |
          if [ "${{ matrix.cross }}" = "windows" ]; then
            # 端到端 Linux 交叉編譯 GOOS=windows 的 no-llvm.exe：
            #   • CC/CXX = zig cc/c++ -target <arch>-windows-gnu（zig 自带 mingw headers+libc+libc+++lld，
            #     不需 Windows SDK/xwin）；cgo 用它编译 C 胶水并用 lld 以 COFF 模式链接出 .exe。
            #   • GOOS/GOARCH 由 Go 侧控制；CGO_ENABLED=1 配非宿主 GOOS 会自动走外部链接器（=CC）。
            #   • 链接预编译包（build-llvm-windows.yml 以同一 zig/-target windows-gnu/libc++ ABI 编成）
            #     的 LLVM 静态库——两边同工具链/同 libc++，-lc++ 只对得上，静态链接才能成功。
            #   • LLVM_CONFIG 指向预编译包里的 Linux ELF 宿主 llvm-config，它输出的 --cflags/--link-static
            #     描述的是交叉编译产物（include 路径 + libLLVM*.a 名），正是 cgo 需要的。
            #   • 但 --system-libs 是 stage-A「原生 Linux」构建时烘进去的（-lrt -ldl -lm），描述的是
            #     宿主而非 Windows 目标：mingw 没有 librt/libdl 导入库，zig 链接直接报
            #     "unable to find dynamic system library \"rt\"/\"dl\""。故用 LLVM_LD_FLAGS_DROP
            #     丢掉这两个 -l 旗标，并显式补上 LLVM 静态库真正需要的 Windows 系统库：
            #     libLLVMSupport 的 Windows/Path.inc 会调 CoInitializeEx/CoCreateInstance 等 COM
            #     API，需要 -lole32；其余（kernel32/advapi32/shell32/user32 等）由 zig 的
            #     mingw 默认链接规格提供（实测最小集即 -lc++ -lole32）。
            export CC="zig cc -target ${{ matrix.zig_target }}"
            export CXX="zig c++ -target ${{ matrix.zig_target }}"
            export GOOS="${{ matrix.goos }}" GOARCH="${{ matrix.goarch }}" CGO_ENABLED=1
            export LLVM_LD_FLAGS_DROP="-lrt -ldl"
            export LLVM_STATIC_EXTRA_LIBS="-lc++ -lole32"
            make no-llvm FULLLLVM=1 LLVM_CONFIG="$LLVM_DEV/bin/llvm-config" LLVM_STATIC_EXTRA_LIBS="$LLVM_STATIC_EXTRA_LIBS" LLVM_HOST_TARGET="${{ matrix.llvm_host_target }}"
          else
            make no-llvm FULLLLVM=1 LLVM_CONFIG=llvm-config-22 LLVM_HOST_TARGET="${{ matrix.llvm_host_target }}"
          fi

      - name: Smoke test with zero external toolchain (-cc zig)
        # C API 預設開啟，且連結交給 zig cc（自帶 clang + lld + libc）：
        # 全程不需要系統 LLVM / clang / linker。
        # 跳過 cross-windows：Linux runner 無法執行 .exe（can_run: false）。
        if: matrix.can_run != false
        shell: bash
        run: |
          BIN="./bin/no-llvm${{ matrix.ext }}"
          "$BIN" build -cc zig -o /tmp/embedded-smoke${{ matrix.ext }} tests/heap.no
          /tmp/embedded-smoke${{ matrix.ext }}

      - name: Verify the fallback switch still works
        if: matrix.can_run != false
        shell: bash
        run: |
          BIN="./bin/no-llvm${{ matrix.ext }}"
          NOLANG_LLVM_CAPI=0 "$BIN" build -cc zig -o /tmp/embedded-fallback${{ matrix.ext }} tests/heap.no
          /tmp/embedded-fallback${{ matrix.ext }}

      - name: Cross-compile smoke test (non-host arch)
        # 釘住「全後端」這個前提：為非宿主架構產生程式碼必須有對應的 LLVM 後端。
        # 若退回宿主裁剪（FULLLLVM=0 的預設），這裡會硬錯：
        #   LLVM C API: resolving target for triple "aarch64-linux-gnu" failed:
        #   No available targets are compatible with triple "aarch64-linux-gnu"
        # 只 build 不 run（執行需要 qemu / 對應的 OS）。
        # 跳過 cross-windows：Linux runner 無法執行 .exe（can_run: false）。
        if: matrix.can_run != false
        shell: bash
        run: |
          BIN="./bin/no-llvm${{ matrix.ext }}"
          OUT="/tmp/embedded-cross-aarch64"
          "$BIN" build -cc zig -target aarch64-linux-gnu -o "$OUT" tests/heap.no
          [ -s "$OUT" ] || { echo "::error::cross-compiled output is empty"; exit 1; }
          echo "cross-compiled aarch64-linux-gnu: $(wc -c < "$OUT") bytes"

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          VERSION_WITHOUT_V=$(echo '${{ github.ref_name }}' | sed 's/^v*//')
          OUT="bin/${{ matrix.asset }}_${VERSION_WITHOUT_V}${{ matrix.ext }}"
          cp "bin/no-llvm${{ matrix.ext }}" "$OUT"
          chmod +x "$OUT" || true
          du -h "$OUT"
          gh release upload "${{ github.ref_name }}" "$OUT" --clobber

  pr-verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Golang
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - name: Cache LLVM
        id: llvm-cache
        uses: actions/cache@v6
        with:
          path: |
            /usr/lib/llvm-21
            /usr/local/bin/opt
            /usr/local/bin/llc
          key: llvm-21-ubuntu-latest

      - name: Install LLVM (opt/llc)
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 21
          sudo apt-get install -y llvm-21 llvm-21-dev
          sudo ln -sf /usr/lib/llvm-21/bin/opt /usr/local/bin/opt
          sudo ln -sf /usr/lib/llvm-21/bin/llc /usr/local/bin/llc

      - name: Add LLVM to PATH
        run: |
          sudo ln -sf /usr/lib/llvm-21/bin/opt /usr/local/bin/opt
          sudo ln -sf /usr/lib/llvm-21/bin/llc /usr/local/bin/llc
          echo "/usr/lib/llvm-21/bin" >> $GITHUB_PATH
          /usr/lib/llvm-21/bin/opt --version

      - name: Cache Zig
        id: zig-cache
        uses: actions/cache@v6
        with:
          path: |
            /home/runner/zig
          key: zig-0.16.0-linux-x86_64

      - name: Install Zig (provides wasi-libc + clang compatible with LLVM 21 IR)
        if: steps.zig-cache.outputs.cache-hit != 'true'
        run: |
          curl -L -o zig.tar.xz https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz
          mkdir -p $HOME/zig
          tar -xf zig.tar.xz -C $HOME/zig --strip-components=1

      - name: Add Zig to PATH
        run: |
          echo "$HOME/zig" >> $GITHUB_PATH
          "$HOME/zig/zig" version

      - name: Cache wasmtime
        id: wasmtime-cache
        uses: actions/cache@v6
        with:
          path: |
            /home/runner/wasmtime
          key: wasmtime-47.0.2-linux-x86_64

      - name: Install wasmtime
        if: steps.wasmtime-cache.outputs.cache-hit != 'true'
        run: |
          curl -L -o wasmtime.tar.xz https://github.com/bytecodealliance/wasmtime/releases/download/v47.0.2/wasmtime-v47.0.2-x86_64-linux.tar.xz
          mkdir -p $HOME/wasmtime
          tar -xf wasmtime.tar.xz -C $HOME/wasmtime --strip-components=1

      - name: Add wasmtime to PATH
        run: |
          echo "$HOME/wasmtime" >> $GITHUB_PATH
          "$HOME/wasmtime/wasmtime" --version

      - name: Build no binary
        run: make no

      - name: Build & smoke the LLVM C API binary (cgo path)
        # 動態鏈接的 no-capi：確保 cgo / LLVM C API 代碼不會在 PR 裡悄悄編譯不過
        # 或退化。（靜態內置 LLVM 的變體只在 tag 時構建，見 build-llvm-variants。）
        run: |
          make no-capi
          NOLANG_LLVM_CAPI=1 ./bin/no-capi build -cc zig -o /tmp/capi-smoke tests/heap.no
          /tmp/capi-smoke

      - name: Build and run test-wasi-hello
        run: |
          ./bin/no build -cc zig -target wasm32-wasi -o /tmp/hello.wasm tests/wasi-hello.no
          output=$(wasmtime run /tmp/hello.wasm)
          echo "Output: $output"
          if [ "$output" != "Hello, WASI!" ]; then
            echo "ERROR: expected 'Hello, WASI!' but got '$output'"
            exit 1
          fi

      - name: Build and run test-wasi-fib
        run: |
          ./bin/no build -cc zig -target wasm32-wasi -o /tmp/fib.wasm tests/wasi-fib.no
          output=$(wasmtime run /tmp/fib.wasm)
          echo "Output: $output"
          # Verify fib-loop results (recursion has a known compiler bug, see test file)
          echo "$output" | grep -q "fib-loop(10) = 55" || (echo "ERROR: fib-loop(10) mismatch" && exit 1)
          echo "$output" | grep -q "fib-loop(30) = 832040" || (echo "ERROR: fib-loop(30) mismatch" && exit 1)
          echo "All fib-loop checks passed"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build no.wasm (wasip1)
        run: make no-wasm

      - name: Build lsp.wasm (wasip1)
        run: make lsp-wasm

      - name: Verify no.wasm version
        run: |
          output=$(wasmtime run docs/static/wasm/no.wasm version)
          echo "Output: $output"
          echo "$output" | grep -q "^version:" || (echo "ERROR: no.wasm version output mismatch" && exit 1)
          echo "no.wasm version check passed"

      - name: Verify lsp.wasm version
        run: |
          output=$(wasmtime run docs/static/wasm/lsp.wasm -version)
          echo "Output: $output"
          echo "$output" | grep -q "^version:" || (echo "ERROR: lsp.wasm version output mismatch" && exit 1)
          echo "lsp.wasm version check passed"

      # ---- PR 门禁：编译/测试质量闸 ----
      # 说明：本作业已安装 LLVM 21（opt/llc），故可同时跑原生编译闸，无需二次安装。
      # 各步骤设计原则：只闸「当前全绿」的项；已知 pre-existing 失败的项（见下）
      # 暂不纳入硬闸，避免误伤所有 PR，待对应修复后补回。
      - name: Go unit tests (green packages)
        # 注：go test ./... 当前有 7 个 pre-existing 失败（build 4 + checker 2 + fmt 1），
        # 故闸只覆盖已知全绿的包：build / cmd/no / mir。
        run: |
          cd ./src
          go test ./build/... ./cmd/no/... ./mir/...

      - name: no test (std library functional suite)
        run: ./bin/no test test/std/

      - name: "no vet (program corpus: src/std + example + test)"
        # 注：set.no 的 3 个 pre-existing idxhndld（131/168/198）已于 2026-10-09 用
        # `#{index-out=zero}` 修复，src/std 现无 ERROR/WARN/idxhndld/ovfhndld，故纳入硬闸。
        # 若后续 std 再出现 idxhndld 编译硬错但 no test 路径不触发，需先修 std 再放开本闸。
        run: ./bin/no vet src/std example test

      - name: Corpus build smoke (representative programs)
        # 代表性子集（均已本地验证可编译通过，且不传递依赖会触发 set.no 的 pre-existing 硬错）。
        # 完整语料（tests/ 527 文件）build 冒烟过重，按需后续可拆出 nightly 作业。
        run: |
          for f in \
            example/test1 \
            example/test2 \
            tests/arr.no \
            tests/vec.no \
            tests/str.no \
            tests/json.no \
            tests/option.no \
            tests/safe-index-containers.no \
            tests/heap.no \
            tests/match-it-scope.no; do
            echo "::group::build $f"
            ./bin/no build "$f" || exit 1
            echo "::endgroup::"
          done
