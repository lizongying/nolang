name: build

on:
  push:
    tags:
      - "v*"
    branches:
      - main
      - master
  pull_request:

jobs:
  build-release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Golang
        uses: actions/setup-go@v4
        with:
          go-version: "1.25"

      - name: Set Version Name
        id: set_version_name
        run: |
          VERSION_WITHOUT_V=$(echo '${{ github.ref_name }}' | sed 's/^v//')
          echo "version_name=${VERSION_WITHOUT_V}" >> $GITHUB_ENV
          echo "build_date=$(date -u '+%s')" >> $GITHUB_ENV

      - name: Build
        run: |
          cd ./src
          mkdir -p ../bin

          go vet ./cmd/no

          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "-s -w -X 'main.version=${{ env.version_name }}' -X 'main.buildDate=${{ env.build_date }}'" -o ./../bin/no_linux_amd64 ./cmd/no

          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -ldflags "-s -w -X 'main.version=${{ env.version_name }}' -X 'main.buildDate=${{ env.build_date }}'" -o ./../bin/no_linux_arm64 ./cmd/no

          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "-s -w -X 'main.version=${{ env.version_name }}' -X 'main.buildDate=${{ env.build_date }}'" -o ./../bin/no_darwin_amd64 ./cmd/no

          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -ldflags "-s -w -X 'main.version=${{ env.version_name }}' -X 'main.buildDate=${{ env.build_date }}'" -o ./../bin/no_darwin_arm64 ./cmd/no

          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -ldflags "-s -w -X 'main.version=${{ env.version_name }}' -X 'main.buildDate=${{ env.build_date }}'" -o ./../bin/no_windows_amd64.exe ./cmd/no

      - name: Get History
        id: get_history
        run: |
          chmod +x history.sh
          output=$(./history.sh)
          echo "$output" > history.md

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          draft: false
          prerelease: false
          body_path: history.md

      - name: Upload Release Asset linux_amd64
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./bin/no_linux_amd64
          asset_name: no_${{ env.version_name }}_linux_amd64
          asset_content_type: application/octet-stream

      - name: Upload Release Asset linux_arm64
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./bin/no_linux_arm64
          asset_name: no_${{ env.version_name }}_linux_arm64
          asset_content_type: application/octet-stream

      - name: Upload Release Asset darwin_amd64
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./bin/no_darwin_amd64
          asset_name: no_${{ env.version_name }}_darwin_amd64
          asset_content_type: application/octet-stream

      - name: Upload Release Asset darwin_arm64
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./bin/no_darwin_arm64
          asset_name: no_${{ env.version_name }}_darwin_arm64
          asset_content_type: application/octet-stream

      - name: Upload Release Asset windows_amd64
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./bin/no_windows_amd64.exe
          asset_name: no_${{ env.version_name }}_windows_amd64.exe
          asset_content_type: application/octet-stream

  wasm-smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Golang
        uses: actions/setup-go@v4
        with:
          go-version: "1.25"

      - name: Install LLVM (opt/llc)
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 21
          sudo apt-get install -y llvm-21 llvm-21-dev
          echo "/usr/lib/llvm-21/bin" >> $GITHUB_PATH
          sudo ln -sf /usr/lib/llvm-21/bin/opt /usr/local/bin/opt
          sudo ln -sf /usr/lib/llvm-21/bin/llc /usr/local/bin/llc
          opt --version

      - name: Install Zig (provides wasi-libc + clang compatible with LLVM 21 IR)
        run: |
          curl -L -o zig.tar.xz https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz
          mkdir -p $HOME/zig
          tar -xf zig.tar.xz -C $HOME/zig --strip-components=1
          echo "$HOME/zig" >> $GITHUB_PATH
          export PATH="$HOME/zig:$PATH"
          zig version

      - name: Install wasmtime
        run: |
          curl -L -o wasmtime.tar.xz https://github.com/bytecodealliance/wasmtime/releases/download/v47.0.2/wasmtime-v47.0.2-x86_64-linux.tar.xz
          mkdir -p $HOME/wasmtime
          tar -xf wasmtime.tar.xz -C $HOME/wasmtime --strip-components=1
          echo "$HOME/wasmtime" >> $GITHUB_PATH
          export PATH="$HOME/wasmtime:$PATH"
          wasmtime --version

      - name: Build no binary
        run: make no

      - name: Build and run test-wasi-hello
        run: |
          ./bin/no build -cc zig -target wasm32-wasi -o /tmp/hello.wasm tests/test-wasi-hello.no
          output=$(wasmtime run /tmp/hello.wasm)
          echo "Output: $output"
          if [ "$output" != "Hello, WASI!" ]; then
            echo "ERROR: expected 'Hello, WASI!' but got '$output'"
            exit 1
          fi

      - name: Build and run test-wasi-fib
        run: |
          ./bin/no build -cc zig -target wasm32-wasi -o /tmp/fib.wasm tests/test-wasi-fib.no
          output=$(wasmtime run /tmp/fib.wasm)
          echo "Output: $output"
          # Verify fib-loop results (recursion has a known compiler bug, see test file)
          echo "$output" | grep -q "fib-loop(10) = 55" || (echo "ERROR: fib-loop(10) mismatch" && exit 1)
          echo "$output" | grep -q "fib-loop(30) = 832040" || (echo "ERROR: fib-loop(30) mismatch" && exit 1)
          echo "All fib-loop checks passed"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build no.wasm (wasip1)
        run: make no-wasm

      - name: Build lsp.wasm (wasip1)
        run: make lsp-wasm

      - name: Verify no.wasm version
        run: |
          output=$(wasmtime run docs/static/wasm/no.wasm version)
          echo "Output: $output"
          echo "$output" | grep -q "^version:" || (echo "ERROR: no.wasm version output mismatch" && exit 1)
          echo "no.wasm version check passed"

      - name: Verify lsp.wasm version
        run: |
          output=$(wasmtime run docs/static/wasm/lsp.wasm -version)
          echo "Output: $output"
          echo "$output" | grep -q "^version:" || (echo "ERROR: lsp.wasm version output mismatch" && exit 1)
          echo "lsp.wasm version check passed"
