name: Build Nolang App

# Demonstrates the reusable nolang build tool:
#   1. downloads a nolang release (via setup-nolang)
#   2. cross-compiles the project for multiple platforms (via build-nolang)
#   3. on a tag push, publishes the binaries as release assets
#
# This workflow is a TEMPLATE for other Nolang projects — copy/adapt this file
# into your own repo. The nolang project itself does not need to run it
# (it builds the compiler directly via build.yml).
# To test locally: trigger manually via "Actions" tab → "Run workflow".

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build nolang project for multiple platforms
        uses: ./.github/actions/build-nolang
        with:
          version: latest
          # Build the demo project shipped in this repo. Replace with your own:
          #   entry: main.no            (single file)
          #   entry: .                   (current dir, needs main.no)
          #   entry: path/to/myproject   (dir containing main.no)
          entry: example/test1
          name: nolang-demo
          targets: >-
            linux/amd64,
            linux/arm64,
            darwin/amd64,
            darwin/arm64,
            wasm32/wasi,
            js
          cc: zig
          # Inject compile-time global constants into all targets:
          #   VERSION -> str "0.1.0"
          #   RELEASE -> bool true (boolean shorthand)
          ld-flags: "-ld-VERSION=0.1.0 -ld-RELEASE"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nolang-binaries
          path: dist/*
          if-no-files-found: warn

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: nolang-binaries
          path: artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
