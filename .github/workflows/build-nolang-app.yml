name: Build Nolang App

# Demonstrates the reusable nolang build tool:
#   1. downloads a nolang release (via setup-nolang)
#   2. cross-compiles the project for multiple platforms (via build-nolang)
#   3. on a tag push, publishes the binaries as release assets
#
# Copy/adapt this file into any Nolang project. Change `entry` to your
# project's directory or main.no, and adjust `targets` / `name` as needed.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build nolang project for multiple platforms
        uses: ./.github/actions/build-nolang
        with:
          version: latest
          # Build the demo project shipped in this repo. Replace with your own:
          #   entry: main.no            (single file)
          #   entry: .                   (current dir, needs main.no)
          #   entry: path/to/myproject   (dir containing main.no)
          entry: example/test1
          name: nolang-demo
          targets: >-
            linux/amd64,
            linux/arm64,
            darwin/amd64,
            darwin/arm64,
            wasm32/wasi,
            js
          cc: zig

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nolang-binaries
          path: dist/*
          if-no-files-found: warn

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: nolang-binaries
          path: artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
