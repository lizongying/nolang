name: Build Nolang
description: >-
  Download a nolang release and cross-compile a Nolang project for one or more
  target platforms using `no build -cc zig -target <triple>`. Produces one binary
  per target into the output directory. Self-contained — does not depend on a
  local setup-nolang action, so it works when called cross-repo. Uses the
  self-contained `no-llvm_*` release asset (LLVM embedded, all backends), so no
  separate LLVM / opt / llc installation is required.

branding:
  icon: package
  color: green

inputs:
  version:
    description: nolang release version ("latest" or explicit, e.g. "1.2.3").
    required: false
    default: latest
  repo:
    description: nolang release repo, e.g. "lizongying/nolang".
    required: false
    default: lizongying/nolang
  token:
    description: GitHub token for the releases API (defaults to job token).
    required: false
    default: ${{ github.token }}
  entry:
    description: >-
      Entry point to build: a .no file or a directory containing main.no.
    required: false
    default: main.no
  targets:
    description: >-
      Comma-separated list of platforms to build. Supported tokens:
      linux/amd64, linux/arm64, darwin/amd64, darwin/arm64, windows/amd64,
      windows/arm64, wasm32/wasi, js. Example:
      "linux/amd64,linux/arm64,darwin/arm64,wasm32/wasi,js"
    required: false
    default: linux/amd64,linux/arm64,darwin/amd64,darwin/arm64,windows/amd64,windows/arm64,wasm32/wasi
  name:
    description: Base name for output binaries (e.g. "myapp" -> myapp-linux-amd64).
    required: false
    default: app
  cc:
    description: >-
      C compiler used to assemble/link the generated code. "zig" enables
      cross-compilation to every target from a single Linux runner; "clang"
      requires a matching native toolchain per target.
    required: false
    default: zig
  zig-version:
    description: Zig version to install when cc=zig (used for cross-compilation).
    required: false
    default: "0.16.0"
  install-toolchain:
    description: >-
      When "true", install Zig when required by the chosen cc. Set "false" if
      the runner already provides it. LLVM is NOT installed: the
      self-contained `no-llvm_*` release asset embeds LLVM (all backends) and
      compiles in-process via the LLVM C API, so opt/llc are never invoked.
    required: false
    default: "true"
  output-dir:
    description: Directory where built binaries are written.
    required: false
    default: dist
  fail-on-error:
    description: >-
      When "true", the action fails if any single target fails to build
      (e.g. due to an upstream compiler limitation). When "false" (default),
      failures are reported but the action still succeeds for the targets that
      built.
    required: false
    default: "false"
  extra-flags:
    description: >-
      Extra flags appended to every `no build` invocation, e.g. "-unsafe".
    required: false
    default: ""
  ld-flags:
    description: >-
      Space-separated list of -ld-KEY=VALUE pairs injected as compile-time
      global constants, e.g. "-ld-VERSION=1.0.0 -ld-DEBUG=true".
      Each pair is passed verbatim to `no build`. Boolean shorthand
      (-ld-RELEASE) is equivalent to -ld-RELEASE=true.
    required: false
    default: ""

outputs:
  output-dir:
    description: Directory containing the built binaries.
  binaries:
    description: Newline-separated list of paths to the binaries that were built.
  failed:
    description: Newline-separated list of target tokens that failed to build.
  nolang-version:
    description: Resolved nolang version without the leading "v" (e.g. "1.2.3").

runs:
  using: composite
  steps:
    # ── 1a. Resolve nolang version (no download yet) ────────────────────────
    - name: Resolve nolang version
      id: resolve
      shell: bash
      env:
        REPO: ${{ inputs.repo }}
        VERSION: ${{ inputs.version }}
        TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail

        # Fetch a releases API URL, authenticating when a token is available.
        # Kept as a function rather than an array of curl args on purpose: the
        # macOS runners ship bash 3.2, where `"${arr[@]}"` on an *empty* array
        # aborts with "unbound variable" under `set -u` (fixed only in bash 4.4).
        gh_get() {
          if [ -n "$TOKEN" ]; then
            curl -fsSL -H "Authorization: Bearer ${TOKEN}" \
              -H "Accept: application/vnd.github+json" "$1"
          else
            curl -fsSL -H "Accept: application/vnd.github+json" "$1"
          fi
        }

        # Normalise the requested version into a single-v tag BEFORE the API
        # lookup below: `releases/tags/<tag>` needs the final tag, so a version
        # that already carries a "v" (e.g. `no version` printing "v0.3.17")
        # must not be turned into "vv0.3.17" first — that lookup would 404.
        if [ "$VERSION" = "latest" ]; then
          REL_JSON=$(gh_get "https://api.github.com/repos/${REPO}/releases/latest")
          TAG=$(printf '%s' "$REL_JSON" | jq -r .tag_name)
        else
          TAG="v$(printf '%s' "$VERSION" | sed 's/^v*//')"
          if ! REL_JSON=$(gh_get "https://api.github.com/repos/${REPO}/releases/tags/${TAG}"); then
            echo "::error::release ${TAG} not found in ${REPO}" >&2
            exit 1
          fi
        fi
        # Belt-and-braces: the latest release's own tag_name could in principle
        # carry a doubled "v", so normalise whatever we ended up with as well.
        # Inputs like "0.3.17", "v0.3.17" or "vv0.3.17" all land on one tag.
        TAG="v$(printf '%s' "$TAG" | sed 's/^v*//')"
        VERSION_NO_V="${TAG#v}"
        echo "Resolved nolang version: $TAG"
        echo "nolang-version=$VERSION_NO_V" >> "$GITHUB_OUTPUT"
        echo "version=$VERSION_NO_V" >> "$GITHUB_OUTPUT"
        echo "tag=$TAG" >> "$GITHUB_OUTPUT"

        # SUFFIX is the asset base (os_arch); EXT is the trailing file extension,
        # kept separate so the version can be inserted BEFORE the .exe, matching
        # exactly how the release workflow (build.yml) names its assets.
        case "${RUNNER_OS}-${RUNNER_ARCH}" in
          Linux-X64)   SUFFIX="linux_amd64";   EXT="" ;;
          Linux-ARM64) SUFFIX="linux_arm64";   EXT="" ;;
          macOS-X64)   SUFFIX="darwin_amd64";  EXT="" ;;
          macOS-ARM64) SUFFIX="darwin_arm64";  EXT="" ;;
          Windows-X64) SUFFIX="windows_amd64"; EXT=".exe" ;;
          *) echo "::error::Unsupported runner ${RUNNER_OS}/${RUNNER_ARCH}" >&2; exit 1 ;;
        esac

        # Prefer the self-contained `no-llvm_*` asset. It links a static libLLVM
        # built with all backends (x86 + aarch64 + arm + wasm) and compiles
        # in-process via the LLVM C API, so opt/llc are never invoked — `-cc zig`
        # supplies the assembler/linker. Releases older than v0.4.0 do not
        # publish it; fall back to the pure-Go `no_*` asset, which *does* shell
        # out to opt/llc, so the caller must provide them (this action no longer
        # installs LLVM).
        EMBEDDED="no-llvm_${SUFFIX}_${VERSION_NO_V}${EXT}"
        PLAIN="no_${SUFFIX}${EXT}"
        ASSET_NAMES=$(printf '%s' "$REL_JSON" | jq -r '.assets[]?.name')
        has_asset() { printf '%s\n' "$ASSET_NAMES" | grep -qxF -- "$1"; }

        if has_asset "$EMBEDDED"; then
          ASSET="$EMBEDDED"; FLAVOR="embedded"
        elif has_asset "$PLAIN"; then
          ASSET="$PLAIN"; FLAVOR="plain"
          echo "::warning::${TAG} does not publish ${EMBEDDED}; falling back to the pure-Go ${PLAIN}. That binary shells out to opt/llc, which this action no longer installs — put them on PATH yourself, or use a release that ships ${EMBEDDED}."
        else
          echo "::error::release ${TAG} has neither ${EMBEDDED} nor ${PLAIN}" >&2
          exit 1
        fi
        echo "Picked asset: ${ASSET} (flavor: ${FLAVOR})"
        echo "asset=$ASSET" >> "$GITHUB_OUTPUT"
        echo "flavor=$FLAVOR" >> "$GITHUB_OUTPUT"

    # ── 1b. Cache nolang binary + std source by version + platform + flavor ──
    # The flavor is part of the key because the cached `no` differs between the
    # embedded-LLVM and pure-Go assets; without it a cached pure-Go binary could
    # be reused for a run that expects the self-contained one (and then fail on
    # the missing opt/llc that this action no longer installs).
    - name: Cache nolang download
      id: nolang-cache
      uses: actions/cache@v6
      with:
        path: |
          ${{ runner.temp }}/nolang-cache
        key: nolang-${{ steps.resolve.outputs.version }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.resolve.outputs.flavor }}

    # ── 1c. Download only when cache misses ─────────────────────────────────
    - name: Download nolang release
      if: steps.nolang-cache.outputs.cache-hit != 'true'
      id: download
      shell: bash
      env:
        REPO: ${{ inputs.repo }}
        TAG: ${{ steps.resolve.outputs.tag }}
        VERSION_NO_V: ${{ steps.resolve.outputs.version }}
        ASSET: ${{ steps.resolve.outputs.asset }}
      run: |
        set -euo pipefail

        CACHE_DIR="$RUNNER_TEMP/nolang-cache"
        mkdir -p "$CACHE_DIR/bin" "$CACHE_DIR/src"

        # Download + install the compiler binary
        URL="https://github.com/${REPO}/releases/download/${TAG}/${ASSET}"
        echo "Downloading $URL"
        curl -fsSL -L -o "$CACHE_DIR/bin/no" "$URL"
        chmod +x "$CACHE_DIR/bin/no"

        # Download the matching std source (src/)
        echo "Downloading source tarball for std lib (tag $TAG)"
        curl -fsSL -L -o "$CACHE_DIR/src/nolang-src.tar.gz" \
          "https://github.com/${REPO}/archive/refs/tags/${TAG}.tar.gz"
        tar -xzf "$CACHE_DIR/src/nolang-src.tar.gz" -C "$CACHE_DIR/src"
        REPO_NAME="${REPO##*/}"
        STD_SRC="$CACHE_DIR/src/${REPO_NAME}-${VERSION_NO_V}/src/std"
        if [ ! -d "$STD_SRC" ]; then
          echo "::error::Expected std lib at $STD_SRC but it was not found" >&2
          exit 1
        fi

    # ── 1d. Set up nolang paths (always runs, from cache or fresh download) ─
    - name: Set up nolang paths
      id: nolang-paths
      shell: bash
      env:
        REPO: ${{ inputs.repo }}
      run: |
        set -euo pipefail
        CACHE_DIR="$RUNNER_TEMP/nolang-cache"
        REPO_NAME="${REPO##*/}"
        VERSION_NO_V="${{ steps.resolve.outputs.version }}"
        STD_SRC="$CACHE_DIR/src/${REPO_NAME}-${VERSION_NO_V}/src/std"
        SRC_ROOT="$CACHE_DIR/src/${REPO_NAME}-${VERSION_NO_V}/src"

        echo "$CACHE_DIR/bin" >> "$GITHUB_PATH"
        echo "nolang-path=$CACHE_DIR/bin/no" >> "$GITHUB_OUTPUT"
        echo "std-src=$STD_SRC" >> "$GITHUB_OUTPUT"
        {
          echo "NOLANG_STD_SRC=$STD_SRC"
          echo "NOLANG_SRC=$SRC_ROOT"
        } >> "$GITHUB_ENV"
        echo "NOLANG_STD_SRC=$STD_SRC"
        "$CACHE_DIR/bin/no" version

    # ── 2. Determine toolchain requirements ─────────────────────────────────
    # Only Zig is ever installed: the embedded-LLVM `no` performs optimization +
    # codegen in-process via the LLVM C API, so opt/llc are never invoked. If the
    # pure-Go fallback asset was picked instead, the warning emitted while
    # resolving the release already told the caller to provide opt/llc.
    - name: Determine toolchain requirements
      if: inputs.install-toolchain == 'true'
      id: toolchain-needs
      shell: bash
      env:
        CC: ${{ inputs.cc }}
      run: |
        set -euo pipefail
        NEED_ZIG=0
        if [ "$CC" = "zig" ]; then
          NEED_ZIG=1
        fi
        echo "need-zig=$NEED_ZIG" >> "$GITHUB_OUTPUT"

    # ── 2a. Cache Zig (portable tarball, easy to cache) ─────────────────────
    # The key carries the host arch: a cached x86_64 Zig must never be reused on
    # an ARM runner (Exec format error), and vice versa.
    - name: Cache Zig
      if: inputs.install-toolchain == 'true' && steps.toolchain-needs.outputs.need-zig == '1'
      id: zig-cache
      uses: actions/cache@v6
      with:
        path: |
          ${{ runner.temp }}/zig
        key: zig-${{ inputs.zig-version }}-${{ runner.os }}-${{ runner.arch }}

    - name: Install Zig
      if: inputs.install-toolchain == 'true' && steps.toolchain-needs.outputs.need-zig == '1' && steps.zig-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        ZIG_VER: ${{ inputs.zig-version }}
      run: |
        set -euo pipefail
        echo "Installing Zig $ZIG_VER..."
        # Resolve the tarball from the HOST arch (RUNNER_ARCH on Linux): hardcoding
        # x86_64 breaks on ubuntu-*-arm runners with "cannot execute binary file".
        # Zig cross-compiles every target (incl. aarch64-windows-gnu) from either
        # host, so only the host arch matters here.
        case "${RUNNER_ARCH}" in
          X64)    ZIG_ARCH=x86_64 ;;
          ARM64)  ZIG_ARCH=aarch64 ;;
          *) echo "::error::Unsupported runner arch ${RUNNER_ARCH} for Zig install" >&2; exit 1 ;;
        esac
        curl -L -o /tmp/zig.tar.xz "https://ziglang.org/download/$ZIG_VER/zig-${ZIG_ARCH}-linux-$ZIG_VER.tar.xz"
        mkdir -p "$RUNNER_TEMP/zig"
        tar -xf /tmp/zig.tar.xz -C "$RUNNER_TEMP/zig" --strip-components=1

    - name: Add Zig to PATH
      if: inputs.install-toolchain == 'true' && steps.toolchain-needs.outputs.need-zig == '1'
      shell: bash
      run: |
        echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"
        "$RUNNER_TEMP/zig/zig" version

    # ── 3. Build all targets ──────────────────────────────────────────────
    - name: Build targets
      id: build
      shell: bash
      env:
        ENTRY: ${{ inputs.entry }}
        NAME: ${{ inputs.name }}
        CC: ${{ inputs.cc }}
        OUTDIR: ${{ inputs.output-dir }}
        EXTRA: ${{ inputs.extra-flags }}
        LD_FLAGS: ${{ inputs.ld-flags }}
        TARGETS: ${{ inputs.targets }}
        FAIL_ON_ERROR: ${{ inputs.fail-on-error }}
      run: |
        set -euo pipefail
        no version
        mkdir -p "$OUTDIR"

        # token -> "<llvm-triple>|<ext>" ; "JS|<ext>" for the JS backend.
        triple_for() {
          case "$1" in
            linux/amd64)   echo "x86_64-linux-gnu|" ;;
            linux/arm64)   echo "aarch64-linux-gnu|" ;;
            darwin/amd64)  echo "x86_64-macos-none|" ;;
            darwin/arm64)  echo "aarch64-macos-none|" ;;
            windows/amd64) echo "x86_64-windows-gnu|.exe" ;;
            windows/arm64) echo "aarch64-windows-gnu|.exe" ;;
            wasm32/wasi)   echo "wasm32-wasi|.wasm" ;;
            js)            echo "JS|.js" ;;
            *)             echo "UNKNOWN|" ;;
          esac
        }

        ok_list=""
        fail_list=""
        overall_rc=0

        IFS=',' read -ra ARR <<< "$TARGETS"
        for t in "${ARR[@]}"; do
          t=$(echo "$t" | tr -d '[:space:]')
          [ -z "$t" ] && continue
          IFS='|' read -r TRIPLE EXT <<< "$(triple_for "$t")"
          if [ "$TRIPLE" = "UNKNOWN" ]; then
            echo "::warning::Unknown target token '$t' — skipped"
            fail_list="$fail_list$t"$'\n'
            continue
          fi

          if [ "$TRIPLE" = "JS" ]; then
            OUT="$OUTDIR/$NAME.js"
            BUILD_CMD=(no build --js -o "$OUT" $ENTRY $EXTRA $LD_FLAGS)
          else
            OUT="$OUTDIR/$NAME-$(echo "$t" | tr '/' '-')$EXT"
            BUILD_CMD=(no build -cc "$CC" -target "$TRIPLE" -o "$OUT" $ENTRY $EXTRA $LD_FLAGS)
          fi

          echo ":::: Building $t -> $OUT"
          echo "\$ ${BUILD_CMD[*]}"
          set +e
          "${BUILD_CMD[@]}" 2>&1
          brc=$?
          set -e

          if [ "$brc" -eq 0 ] && [ -s "$OUT" ]; then
            echo "::notice::Built $t -> $OUT"
            ok_list="$ok_list$OUT"$'\n'
          else
            echo "::error::Build failed for $t (rc=$brc)"
            fail_list="$fail_list$t"$'\n'
            [ "$FAIL_ON_ERROR" = "true" ] && overall_rc=1
          fi
        done

        echo "==== BUILD SUMMARY ===="
        echo "OK:";     printf '%s' "$ok_list"
        echo "FAILED:"; printf '%s' "$fail_list"

        {
          echo "binaries<<EOF"
          printf '%s' "$ok_list"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"
        {
          echo "failed<<EOF"
          printf '%s' "$fail_list"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"
        echo "output-dir=$OUTDIR" >> "$GITHUB_OUTPUT"
        exit "$overall_rc"
