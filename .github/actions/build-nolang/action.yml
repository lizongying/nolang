name: Build Nolang
description: >-
  Download a nolang release and cross-compile a Nolang project for one or more
  target platforms using `no build -cc zig -target <triple>`. Produces one binary
  per target into the output directory. Self-contained — does not depend on a
  local setup-nolang action, so it works when called cross-repo.

branding:
  icon: package
  color: green

inputs:
  version:
    description: nolang release version ("latest" or explicit, e.g. "1.2.3").
    required: false
    default: latest
  repo:
    description: nolang release repo, e.g. "lizongying/nolang".
    required: false
    default: lizongying/nolang
  token:
    description: GitHub token for the releases API (defaults to job token).
    required: false
    default: ${{ github.token }}
  entry:
    description: >-
      Entry point to build: a .no file or a directory containing main.no.
    required: false
    default: main.no
  targets:
    description: >-
      Comma-separated list of platforms to build. Supported tokens:
      linux/amd64, linux/arm64, darwin/amd64, darwin/arm64, windows/amd64,
      windows/arm64, wasm32/wasi, js. Example:
      "linux/amd64,linux/arm64,darwin/arm64,wasm32/wasi,js"
    required: false
    default: linux/amd64,linux/arm64,darwin/amd64,darwin/arm64,wasm32/wasi
  name:
    description: Base name for output binaries (e.g. "myapp" -> myapp-linux-amd64).
    required: false
    default: app
  cc:
    description: >-
      C compiler used to assemble/link the generated code. "zig" enables
      cross-compilation to every target from a single Linux runner; "clang"
      requires a matching native toolchain per target.
    required: false
    default: zig
  zig-version:
    description: Zig version to install when cc=zig (used for cross-compilation).
    required: false
    default: "0.16.0"
  llvm-version:
    description: LLVM version providing opt/llc for native + wasi builds (Ubuntu only).
    required: false
    default: "21"
  install-toolchain:
    description: >-
      When "true", install LLVM (opt/llc) and/or Zig as required by the chosen
      targets/cc. Set "false" if the runner already provides them.
    required: false
    default: "true"
  output-dir:
    description: Directory where built binaries are written.
    required: false
    default: dist
  fail-on-error:
    description: >-
      When "true", the action fails if any single target fails to build
      (e.g. due to an upstream compiler limitation). When "false" (default),
      failures are reported but the action still succeeds for the targets that
      built.
    required: false
    default: "false"
  extra-flags:
    description: >-
      Extra flags appended to every `no build` invocation, e.g. "-unsafe".
    required: false
    default: ""

outputs:
  output-dir:
    description: Directory containing the built binaries.
  binaries:
    description: Newline-separated list of paths to the binaries that were built.
  failed:
    description: Newline-separated list of target tokens that failed to build.
  nolang-version:
    description: Resolved nolang version without the leading "v" (e.g. "1.2.3").

runs:
  using: composite
  steps:
    # ── 1. Download no compiler binary + std source (inlined setup-nolang) ──
    - name: Download nolang release
      id: download
      shell: bash
      env:
        REPO: ${{ inputs.repo }}
        VERSION: ${{ inputs.version }}
        TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail

        # ── 1a. Resolve the release tag ────────────────────────────────────
        if [ "$VERSION" = "latest" ]; then
          API="https://api.github.com/repos/${REPO}/releases/latest"
          if [ -n "$TOKEN" ]; then
            TAG=$(curl -fsSL -H "Authorization: Bearer ${TOKEN}" \
              -H "Accept: application/vnd.github+json" "$API" | jq -r .tag_name)
          else
            TAG=$(curl -fsSL -H "Accept: application/vnd.github+json" "$API" | jq -r .tag_name)
          fi
        else
          TAG="v${VERSION#v}"
        fi
        VERSION_NO_V="${TAG#v}"
        echo "Resolved nolang version: $TAG"
        echo "nolang-version=$VERSION_NO_V" >> "$GITHUB_OUTPUT"

        # ── 1b. Pick the release asset for this runner ─────────────────────
        case "${RUNNER_OS}-${RUNNER_ARCH}" in
          Linux-X64)   ASSET="no_${VERSION_NO_V}_linux_amd64" ;;
          Linux-ARM64) ASSET="no_${VERSION_NO_V}_linux_arm64" ;;
          macOS-X64)   ASSET="no_${VERSION_NO_V}_darwin_amd64" ;;
          macOS-ARM64) ASSET="no_${VERSION_NO_V}_darwin_arm64" ;;
          Windows-X64) ASSET="no_${VERSION_NO_V}_windows_amd64.exe" ;;
          *) echo "::error::Unsupported runner ${RUNNER_OS}/${RUNNER_ARCH}" >&2; exit 1 ;;
        esac

        # ── 1c. Download + install the compiler binary ────────────────────
        URL="https://github.com/${REPO}/releases/download/${TAG}/${ASSET}"
        INSTALL_DIR="$RUNNER_TEMP/nolang-bin"
        mkdir -p "$INSTALL_DIR"
        echo "Downloading $URL"
        curl -fsSL -L -o "$INSTALL_DIR/no" "$URL"
        chmod +x "$INSTALL_DIR/no"
        echo "$INSTALL_DIR" >> "$GITHUB_PATH"
        echo "nolang-path=$INSTALL_DIR/no" >> "$GITHUB_OUTPUT"
        "$INSTALL_DIR/no" version

        # ── 1d. Download the matching std source (src/) ───────────────────
        SRC_DIR="$RUNNER_TEMP/nolang-src"
        mkdir -p "$SRC_DIR"
        SRC_TAR="$SRC_DIR/nolang-src.tar.gz"
        echo "Downloading source tarball for std lib (tag $TAG)"
        curl -fsSL -L -o "$SRC_TAR" "https://github.com/${REPO}/archive/refs/tags/${TAG}.tar.gz"
        tar -xzf "$SRC_TAR" -C "$SRC_DIR"
        REPO_NAME="${REPO##*/}"
        STD_SRC="$SRC_DIR/${REPO_NAME}-${VERSION_NO_V}/src/std"
        SRC_ROOT="$SRC_DIR/${REPO_NAME}-${VERSION_NO_V}/src"
        if [ ! -d "$STD_SRC" ]; then
          echo "::error::Expected std lib at $STD_SRC but it was not found" >&2
          exit 1
        fi
        echo "std-src=$STD_SRC" >> "$GITHUB_OUTPUT"
        {
          echo "NOLANG_STD_SRC=$STD_SRC"
          echo "NOLANG_SRC=$SRC_ROOT"
        } >> "$GITHUB_ENV"
        echo "NOLANG_STD_SRC=$STD_SRC"

    # ── 2. Install toolchain (LLVM + Zig) ─────────────────────────────────
    - name: Install toolchain (LLVM + Zig)
      if: inputs.install-toolchain == 'true'
      shell: bash
      env:
        TARGETS: ${{ inputs.targets }}
        CC: ${{ inputs.cc }}
        LLVM_VER: ${{ inputs.llvm-version }}
        ZIG_VER: ${{ inputs.zig-version }}
      run: |
        set -euo pipefail
        NEED_LLVM=0
        NEED_ZIG=0
        # LLVM (opt/llc) is required for every target except pure-JS.
        case "$TARGETS" in
          *js*) ;;
          *) NEED_LLVM=1 ;;
        esac
        [ "$CC" = "zig" ] && NEED_ZIG=1

        if [ "$NEED_LLVM" = "1" ]; then
          echo "Installing LLVM $LLVM_VER (opt/llc)…"
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- "$LLVM_VER"
          sudo apt-get install -y "llvm-$LLVM_VER"
          echo "/usr/lib/llvm-$LLVM_VER/bin" >> "$GITHUB_PATH"
          sudo ln -sf "/usr/lib/llvm-$LLVM_VER/bin/opt" /usr/local/bin/opt
          sudo ln -sf "/usr/lib/llvm-$LLVM_VER/bin/llc" /usr/local/bin/llc
          opt --version
        fi

        if [ "$NEED_ZIG" = "1" ]; then
          echo "Installing Zig $ZIG_VER…"
          curl -L -o /tmp/zig.tar.xz "https://ziglang.org/download/$ZIG_VER/zig-x86_64-linux-$ZIG_VER.tar.xz"
          mkdir -p "$RUNNER_TEMP/zig"
          tar -xf /tmp/zig.tar.xz -C "$RUNNER_TEMP/zig" --strip-components=1
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/zig:$PATH"
          zig version
        fi

    # ── 3. Build all targets ──────────────────────────────────────────────
    - name: Build targets
      id: build
      shell: bash
      env:
        ENTRY: ${{ inputs.entry }}
        NAME: ${{ inputs.name }}
        CC: ${{ inputs.cc }}
        OUTDIR: ${{ inputs.output-dir }}
        EXTRA: ${{ inputs.extra-flags }}
        TARGETS: ${{ inputs.targets }}
        FAIL_ON_ERROR: ${{ inputs.fail-on-error }}
      run: |
        set -euo pipefail
        no version
        mkdir -p "$OUTDIR"

        # token -> "<llvm-triple>|<ext>" ; "JS|<ext>" for the JS backend.
        triple_for() {
          case "$1" in
            linux/amd64)   echo "x86_64-linux-gnu|" ;;
            linux/arm64)   echo "aarch64-linux-gnu|" ;;
            darwin/amd64)  echo "x86_64-macos-none|" ;;
            darwin/arm64)  echo "aarch64-macos-none|" ;;
            windows/amd64) echo "x86_64-windows-gnu|.exe" ;;
            windows/arm64) echo "aarch64-windows-gnu|.exe" ;;
            wasm32/wasi)   echo "wasm32-wasi|.wasm" ;;
            js)            echo "JS|.js" ;;
            *)             echo "UNKNOWN|" ;;
          esac
        }

        ok_list=""
        fail_list=""
        overall_rc=0

        IFS=',' read -ra ARR <<< "$TARGETS"
        for t in "${ARR[@]}"; do
          t=$(echo "$t" | tr -d '[:space:]')
          [ -z "$t" ] && continue
          IFS='|' read -r TRIPLE EXT <<< "$(triple_for "$t")"
          if [ "$TRIPLE" = "UNKNOWN" ]; then
            echo "::warning::Unknown target token '$t' — skipped"
            fail_list="$fail_list$t"$'\n'
            continue
          fi

          if [ "$TRIPLE" = "JS" ]; then
            OUT="$OUTDIR/$NAME.js"
            BUILD_CMD=(no build --js -o "$OUT" $ENTRY $EXTRA)
          else
            OUT="$OUTDIR/$NAME-$(echo "$t" | tr '/' '-')$EXT"
            BUILD_CMD=(no build -cc "$CC" -target "$TRIPLE" -o "$OUT" $ENTRY $EXTRA)
          fi

          echo ":::: Building $t -> $OUT"
          echo "\$ ${BUILD_CMD[*]}"
          set +e
          "${BUILD_CMD[@]}" 2>&1
          brc=$?
          set -e

          if [ "$brc" -eq 0 ] && [ -s "$OUT" ]; then
            echo "::notice::Built $t -> $OUT"
            ok_list="$ok_list$OUT"$'\n'
          else
            echo "::error::Build failed for $t (rc=$brc)"
            fail_list="$fail_list$t"$'\n'
            [ "$FAIL_ON_ERROR" = "true" ] && overall_rc=1
          fi
        done

        echo "==== BUILD SUMMARY ===="
        echo "OK:";     printf '%s' "$ok_list"
        echo "FAILED:"; printf '%s' "$fail_list"

        {
          echo "binaries<<EOF"
          printf '%s' "$ok_list"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"
        {
          echo "failed<<EOF"
          printf '%s' "$fail_list"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"
        echo "output-dir=$OUTDIR" >> "$GITHUB_OUTPUT"
        exit "$overall_rc"
